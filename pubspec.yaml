name: ludo_mela
description: "Ludo Mela — offline Ludo with bots, pass & play, tabletop and same-Wi-Fi rooms."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  # Material/Cupertino/Widgets strings and right-to-left layout for the extra languages.
  flutter_localizations:
    sdk: flutter
  # Dates and numbers in the active language (Insights, timers).
  intl: ^0.20.2

  # Rules, modes, bots, puzzles and fairness stats (pure Dart, tested on its own).
  ludo_engine:
    path: packages/ludo_engine

  # State + navigation (same stack as Card House / Mind Isles: Riverpod without codegen, go_router).
  flutter_riverpod: ^2.6.1
  go_router: ^18.0.2

  # Save file, backups.
  path_provider: ^2.1.5
  path: ^1.9.1

  # Dice rattle, hops, captures, jingles and the mela music loop (generated by tool/sounds).
  audioplayers: ^6.8.1

  # AdMob: banner (match screens only), break ad after a finished match, opt-in rewarded + consent.
  google_mobile_ads: ^9.2.0
  # The one real-money item: "Remove ads".
  in_app_purchase: ^3.2.0

  # Wi-Fi party: find rooms (DNS-SD), join by QR, keep the host awake, know when Wi-Fi drops.
  bonsoir: ^7.1.6
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  wakelock_plus: ^1.8.2
  connectivity_plus: ^7.3.2

  # Insights charts.
  fl_chart: ^1.2.0

  # "Your photo" avatar (camera or gallery), cropped in-app.
  image_picker: ^1.2.4

  # Optional "your daily gift is ready" reminder (off by default for kids).
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.0

  # Backup export (share sheet) and import (file picker).
  share_plus: ^13.3.1
  file_picker: ^13.3.2

  # SVG path strings → Flutter Paths (animal avatars, icons drawn from the design board).
  path_parsing: ^1.1.0
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/licenses/
    # Translation packs, one file per area (merged at load; English needs none).
    - assets/l10n/bn/
    - assets/l10n/hi/

  # The design's faces (all SIL OFL, from github.com/google/fonts; licences in assets/licenses):
  # Lilita One (display, outlined), Baloo 2 (body; Latin + Devanagari for Hindi) and
  # Baloo Da 2 (Bangla). The Baloo files are variable fonts: AppFonts sets the weight
  # axis explicitly. Only AppFonts (lib/core/theme/fonts.dart) names a family.
  fonts:
    - family: LilitaOne
      fonts:
        - asset: assets/fonts/LilitaOne-Regular.ttf
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Variable.ttf
    - family: BalooDa2
      fonts:
        - asset: assets/fonts/BalooDa2-Variable.ttf

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ludo Mela — Select mode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
:root{--e:cubic-bezier(.2,.8,.2,1);--b:cubic-bezier(.34,1.56,.64,1)}
button,a{-webkit-tap-highlight-color:transparent;transition:transform 150ms var(--b),filter 160ms var(--e),background 160ms var(--e),box-shadow 160ms var(--e)}
button:focus-visible,a:focus-visible{outline:3px solid #FFFFFF;outline-offset:3px}
.ttl{font-family:'Lilita One',sans-serif;font-weight:400;color:#FFFFFF;letter-spacing:.4px;text-shadow:0 -1.5px 0 #0A2A6B,1.5px 0 0 #0A2A6B,0 1.5px 0 #0A2A6B,-1.5px 0 0 #0A2A6B,1.2px 1.2px 0 #0A2A6B,-1.2px 1.2px 0 #0A2A6B,1.2px -1.2px 0 #0A2A6B,-1.2px -1.2px 0 #0A2A6B,0 3px 0 #0A2A6B}
.gl{position:relative;border:0;cursor:pointer;font-family:'Lilita One',sans-serif;font-weight:400;color:#FFFFFF;letter-spacing:.4px;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;text-shadow:0 2px 0 rgba(0,0,0,.3);box-sizing:border-box}
.gl::after{content:'';position:absolute;left:6%;right:6%;top:3px;height:40%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.gl:active{transform:translateY(3px) scale(.98)}
.g-green{background:linear-gradient(#8DEB50,#47BA2B 55%,#2E9A1B);box-shadow:inset 0 -3px 0 rgba(0,0,0,.14),0 5px 0 #1D6B0F,0 9px 12px rgba(0,20,60,.3)}
.g-red{background:linear-gradient(#FF8A7A,#F2463B 55%,#C4251B);box-shadow:inset 0 -3px 0 rgba(0,0,0,.14),0 4px 0 #7E120B,0 7px 10px rgba(0,20,60,.3)}
.seg{flex:1;height:40px;border:0;border-radius:10px;cursor:pointer;font:400 15px 'Lilita One',sans-serif;letter-spacing:.3px}
.lm-pop{animation:lmPop 420ms var(--b) backwards}
.lm-tick{animation:lmTick 300ms var(--b) backwards}
.lm-pulse{animation:lmPulse 1.6s ease-in-out infinite}
@keyframes lmPop{from{opacity:0;transform:scale(.6)}}
@keyframes lmTick{from{transform:scale(0)}}
@keyframes lmPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@media (prefers-reduced-motion: reduce){*{animation-duration:1ms !important;animation-iteration-count:1 !important;transition-duration:1ms !important}}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#1764D2;font-family:'Baloo 2',system-ui,sans-serif;color:#FFFFFF">
  <svg width="0" height="0" aria-hidden="true" style="position:absolute"><defs>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFEC8F"></stop><stop offset=".55" stop-color="#FFC21F"></stop><stop offset="1" stop-color="#E08A00"></stop></linearGradient>
  </defs></svg>
  <div style="position:absolute;inset:0;background:linear-gradient(#0B2466 0%,#143A96 38%,#2462CF 62%,#2E74E0 100%)"></div>
  <div style="position:absolute;left:0;right:0;top:0;height:50px;background:repeating-linear-gradient(90deg,#E8322B 0 26px,#FFF1D0 26px 52px)"></div>
  <div style="position:absolute;left:10px;top:124px;width:85px;height:88px;border-radius:16px;background:#FF8A3D"></div>
  <div style="position:absolute;left:103px;top:124px;width:85px;height:88px;border-radius:16px;background:#2FB8C8"></div>
  <div style="position:absolute;left:196px;top:124px;width:85px;height:88px;border-radius:16px;background:#F0577A"></div>
  <div style="position:absolute;left:289px;top:124px;width:85px;height:88px;border-radius:16px;background:#4CBF3E"></div>
  <div style="position:absolute;left:10px;top:228px;width:370px;height:150px;border-radius:16px;background:#FFA51F"></div>
  <div style="position:absolute;left:10px;top:428px;width:180px;height:92px;border-radius:16px;background:#2F86E6"></div>
  <div style="position:absolute;left:200px;top:428px;width:180px;height:92px;border-radius:16px;background:#47BA2B"></div>
  <div style="position:absolute;left:10px;top:530px;width:180px;height:92px;border-radius:16px;background:#8B55F0"></div>
  <div style="position:absolute;left:200px;top:530px;width:180px;height:92px;border-radius:16px;background:#E0407E"></div>
  <div style="position:absolute;left:10px;right:10px;bottom:20px;height:66px;border-radius:33px;background:#0A2464"></div>
  <div style="position:absolute;inset:0;background:rgba(4,14,40,.72)"></div>

  <div style="position:absolute;left:14px;right:14px;top:126px">
    <div class="lm-pop" style="position:relative;border-radius:20px;background:linear-gradient(#2C7BDA,#1B57B4);box-shadow:inset 0 0 0 3px #5FB0FF,inset 0 5px 0 rgba(255,255,255,.18),0 6px 0 #0A2A6B,0 18px 30px rgba(0,0,0,.45);padding:40px 12px 16px">
      <div style="position:absolute;left:50%;top:-24px;transform:translateX(-50%);width:230px;height:50px">
        <svg width="230" height="50" viewBox="0 0 230 50" aria-hidden="true" style="position:absolute;inset:0"><path d="M8 14h24v30H8l8-15z" fill="#0D4A9E"></path><path d="M222 14h-24v30h24l-8-15z" fill="#0D4A9E"></path><path d="M24 4h182v36H24z" fill="#2F95F2" stroke="#0A2A6B" stroke-width="2.5" stroke-linejoin="round"></path><path d="M28 8h174v8H28z" fill="#FFFFFF" opacity=".3"></path></svg>
        <h1 class="ttl" style="position:relative;margin:0;text-align:center;font-size:24px;line-height:44px">Game Options</h1>
      </div>
      <a href="Main.dc.html" aria-label="Close" class="gl g-red" style="position:absolute;right:-8px;top:-14px;width:40px;height:40px;border-radius:12px"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="position:relative;z-index:1"><path d="M5 5l14 14M19 5L5 19" stroke="#FFFFFF" stroke-width="4.2" stroke-linecap="round"></path></svg></a>

      <div role="radiogroup" aria-label="Who plays" style="display:flex;gap:4px;padding:4px;border-radius:13px;background:#0D3680;box-shadow:inset 0 2px 4px rgba(0,0,0,.45)">
        <sc-for list="{{who}}" as="w" hint-placeholder-count="2">
          <button type="button" role="radio" aria-checked="{{w.on}}" class="seg" onClick="{{w.tap}}" style="background:{{w.bg}};color:{{w.ink}};box-shadow:{{w.sh}};text-shadow:{{w.ts}}">{{w.label}}</button>
        </sc-for>
      </div>

      <div class="ttl" style="font-size:15px;margin:12px 2px 6px">Game mode</div>
      <div role="radiogroup" aria-label="Game mode" style="display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:6px">
        <sc-for list="{{modes}}" as="m" hint-placeholder-count="4">
          <button type="button" role="radio" aria-checked="{{m.on}}" onClick="{{m.tap}}" style="position:relative;height:74px;border:0;cursor:pointer;border-radius:12px;background:{{m.bg}};box-shadow:{{m.sh}};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0">
            <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true"><sc-for list="{{m.icon}}" as="q" hint-placeholder-count="4"><path d="{{q.d}}" fill="{{q.f}}" stroke="{{q.s}}" stroke-width="{{q.w}}" stroke-linejoin="round" stroke-linecap="round"></path></sc-for></svg>
            <span class="ttl" style="font-size:13px">{{m.label}}</span>
            <span style="font:700 9.5px 'Baloo 2',sans-serif;color:#CFE6FF;line-height:1">{{m.sub}}</span>
          </button>
        </sc-for>
      </div>

      <div class="ttl" style="font-size:15px;margin:12px 2px 6px">Select players</div>
      <div role="radiogroup" aria-label="Number of players" style="display:flex;flex-direction:column;gap:6px">
        <sc-for list="{{counts}}" as="c" hint-placeholder-count="3">
          <button type="button" role="radio" aria-checked="{{c.on}}" onClick="{{c.tap}}" style="height:58px;border:0;cursor:pointer;border-radius:12px;background:{{c.bg}};box-shadow:{{c.sh}};display:flex;align-items:center;gap:10px;padding:0 12px 0 8px;text-align:start">
            <span style="position:relative;width:44px;height:44px;flex:none;border-radius:6px;background:linear-gradient(#EBB984,#BE7F44);box-shadow:0 3px 0 #6B3E16;transform:rotate(-6deg)">
              <span style="position:absolute;left:2px;top:2px;width:40px;height:40px;border-radius:4px;overflow:hidden;background:#FFFFFF;display:block">
                <sc-for list="{{c.yards}}" as="y" hint-placeholder-count="4"><span style="position:absolute;left:{{y.x}}px;top:{{y.y}}px;width:16px;height:16px;background:{{y.c}}"><span style="position:absolute;left:3px;top:3px;width:10px;height:10px;border-radius:2px;background:{{y.d}}"></span></span></sc-for>
                <span style="position:absolute;left:16px;top:16px;width:8px;height:8px;background:conic-gradient(from -45deg,#F8C21C 0 90deg,#1E8BEA 90deg 180deg,#E8322B 180deg 270deg,#76BE2E 270deg 360deg)"></span>
              </span>
            </span>
            <span style="flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.1">
              <span class="ttl" style="font-size:19px">{{c.title}}</span>
              <span style="font:700 11.5px 'Baloo 2',sans-serif;color:#CFE6FF">{{c.sub}}</span>
            </span>
            <span style="width:30px;height:30px;flex:none;border-radius:8px;background:{{c.boxBg}};box-shadow:inset 0 2px 3px rgba(0,0,0,.35),0 0 0 2px {{c.boxRim}};display:grid;place-items:center">
              <sc-if value="{{c.on}}" hint-placeholder-val="{{ false }}"><svg class="lm-tick" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if>
            </span>
          </button>
        </sc-for>
      </div>

      <sc-if value="{{isAi}}" hint-placeholder-val="{{ true }}">
        <div class="ttl" style="font-size:15px;margin:12px 2px 6px">Computer level</div>
        <div role="radiogroup" aria-label="Computer level" style="display:flex;gap:4px;padding:4px;border-radius:13px;background:#0D3680;box-shadow:inset 0 2px 4px rgba(0,0,0,.45)">
          <sc-for list="{{levels}}" as="l" hint-placeholder-count="3">
            <button type="button" role="radio" aria-checked="{{l.on}}" class="seg" onClick="{{l.tap}}" style="background:{{l.bg}};color:{{l.ink}};box-shadow:{{l.sh}};text-shadow:{{l.ts}}">{{l.label}}</button>
          </sc-for>
        </div>
      </sc-if>

      <div style="margin-top:12px;display:flex;align-items:center;gap:10px">
        <span style="flex:1;min-width:0;height:48px;border-radius:12px;background:#0D3680;box-shadow:inset 0 2px 4px rgba(0,0,0,.45);display:flex;flex-direction:column;justify-content:center;padding:0 10px;line-height:1.15">
          <span style="font:700 11px 'Baloo 2',sans-serif;color:#9DB4D8">{{costLabel}}</span>
          <span class="ttl" style="font-size:15px;color:#FFE27A;white-space:nowrap">{{cost}}</span>
        </span>
        <a href="{{playHref}}" class="gl g-green lm-pulse" style="width:150px;height:52px;border-radius:14px;font-size:24px;flex:none"><span style="position:relative;z-index:1">Play</span></a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const P = (d, f, s, w) => ({ d, f: f || 'none', s: s || 'none', w: w || 0 });
const MODES = [
  { id: 'classic', label: 'Classic', sub: '4 pucks home', icon: [P('M4 4h24v24H4z', '#FFFFFF', '#0A2A6B', 1.5), P('M4 4h10v10H4z', '#76BE2E'), P('M18 4h10v10H18z', '#F8C21C'), P('M4 18h10v10H4z', '#E8322B'), P('M18 18h10v10H18z', '#1E8BEA')] },
  { id: 'quick', label: 'Quick', sub: '1 puck · 5 min', icon: [P('M16 4a12 12 0 1 0 .01 0z', '#FFFFFF', '#0A2A6B', 1.5), P('M16 9v7l5 3', 'none', '#E8322B', 3), P('M9 2h14', 'none', '#0A2A6B', 3)] },
  { id: 'mayhem', label: 'Mayhem', sub: 'power-ups', icon: [P('M18 2L6 18h8l-2 12 14-18h-8z', 'url(#gGold)', '#8A4B00', 1.5)] },
  { id: 'cup', label: 'Mela Cup', sub: 'knockout', icon: [P('M9 4h14v9a7 7 0 0 1-14 0z', 'url(#gGold)', '#8A4B00', 1.5), P('M9 7H4v2a5 5 0 0 0 5 5M23 7h5v2a5 5 0 0 1-5 5', 'none', '#8A4B00', 1.8), P('M13 21h6v4h-6zM9 25h14v4H9z', '#C06A22', '#5A2E00', 1.2)] }
];
const ON = { bg: 'linear-gradient(#FFE27A,#F2B200)', ink: '#5A2E00', sh: 'inset 0 2px 0 rgba(255,255,255,.6),0 2px 0 #9A5600', ts: '0 1px 0 rgba(255,255,255,.5)' };
const OFF = { bg: 'transparent', ink: '#9DB4D8', sh: 'none', ts: 'none' };
const YARD = { g: ['#76BE2E', '#55961C', 0, 0], y: ['#F8C21C', '#D29A12', 24, 0], r: ['#E8322B', '#B11F1A', 0, 24], b: ['#1E8BEA', '#1265C2', 24, 24] };
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { who: 'ai', mode: 'classic', n: 4, level: 1 };
  }
  renderVals() {
    const st = this.state;
    const isAi = st.who === 'ai';
    const seg = (on) => Object.assign({ on: on ? 'true' : 'false' }, on ? ON : OFF);
    const who = [['ai', 'Vs Computer'], ['pass', 'Pass & Play']].map((w) => Object.assign(seg(st.who === w[0]), { label: w[1], tap: () => this.setState({ who: w[0] }) }));
    const modes = MODES.map((m) => { const on = st.mode === m.id; return { label: m.label, sub: m.sub, icon: m.icon, on: on ? 'true' : 'false',
      bg: on ? 'linear-gradient(#3B8CEB,#2368C8)' : 'linear-gradient(#2258AE,#1A4A98)', sh: on ? 'inset 0 0 0 2.5px #FFE27A,0 3px 0 #0A2A6B' : 'inset 0 0 0 2px #3F78D6,0 3px 0 #0A2A6B',
      tap: () => this.setState({ mode: m.id }) }; });
    const SEATS = { 2: ['r', 'y'], 3: ['r', 'g', 'y'], 4: ['r', 'g', 'y', 'b'] };
    const counts = [2, 3, 4].map((n) => {
      const on = st.n === n;
      const yards = ['g', 'y', 'r', 'b'].map((k) => { const y = YARD[k], used = SEATS[n].indexOf(k) >= 0; return { x: y[2], y: y[3], c: used ? y[0] : '#C9CFD9', d: used ? y[1] : '#AEB6C3' }; });
      return { on, yards, title: n + ' Players',
        sub: isAi ? (n === 2 ? 'You vs 1 computer · face to face' : 'You vs ' + (n - 1) + ' computers') : n + ' friends share this phone',
        bg: on ? 'linear-gradient(#3B8CEB,#2368C8)' : 'linear-gradient(#2258AE,#1A4A98)', sh: on ? 'inset 0 0 0 2.5px #FFE27A,0 3px 0 #0A2A6B' : 'inset 0 0 0 2px #3F78D6,0 3px 0 #0A2A6B',
        boxBg: on ? '#47BA2B' : '#0D3680', boxRim: on ? '#B9F58A' : '#3F78D6', tap: () => this.setState({ n }) };
    });
    const levels = ['Easy', 'Smart', 'Master'].map((l, i) => Object.assign(seg(st.level === i), { label: l, tap: () => this.setState({ level: i }) }));
    const entry = { classic: 500, quick: 200, mayhem: 400, cup: 1000 }[st.mode];
    const win = entry * st.n / 2 * (st.mode === 'cup' ? 3 : 2);
    return {
      who, modes, counts, levels, isAi,
      costLabel: isAi ? 'Entry · winner takes' : 'Pass & play is always free',
      cost: isAi ? entry.toLocaleString('en-US') + ' coins · win ' + win.toLocaleString('en-US') : 'No coins · no XP loss',
      playHref: isAi ? (st.mode === 'mayhem' ? 'Mayhem.dc.html' : (st.mode === 'cup' ? 'Cup.dc.html' : 'VsIntro.dc.html')) : 'PassPlaySetup.dc.html'
    };
  }
}
</script>
</body>
</html>

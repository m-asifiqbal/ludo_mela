<style>
body{margin:0}
a{color:#FFE27A}a:hover{color:#FFF3B8}
:root{--e:cubic-bezier(.2,.8,.2,1);--b:cubic-bezier(.34,1.56,.64,1)}
button,a{-webkit-tap-highlight-color:transparent;transition:transform 150ms var(--b),filter 160ms var(--e),box-shadow 160ms var(--e),opacity 160ms var(--e)}
button:focus-visible,a:focus-visible{outline:3px solid #FFFFFF;outline-offset:3px}
.ttl{font-family:'Lilita One',sans-serif;font-weight:400;color:#FFFFFF;letter-spacing:.4px;text-shadow:0 -1.5px 0 #0A2A6B,1.5px 0 0 #0A2A6B,0 1.5px 0 #0A2A6B,-1.5px 0 0 #0A2A6B,1.2px 1.2px 0 #0A2A6B,-1.2px 1.2px 0 #0A2A6B,1.2px -1.2px 0 #0A2A6B,-1.2px -1.2px 0 #0A2A6B,0 3px 0 #0A2A6B}
.gl{position:relative;border:0;cursor:pointer;font-family:'Lilita One',sans-serif;font-weight:400;color:#FFFFFF;letter-spacing:.4px;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;text-shadow:0 2px 0 rgba(0,0,0,.3);box-sizing:border-box}
.gl::after{content:'';position:absolute;left:8%;right:8%;top:3px;height:42%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,0));pointer-events:none}
.gl:active{transform:translateY(3px) scale(.98)}
.g-green{background:linear-gradient(#8DEB50,#47BA2B 55%,#2E9A1B);box-shadow:inset 0 -3px 0 rgba(0,0,0,.14),0 5px 0 #1D6B0F,0 9px 14px rgba(0,20,60,.35)}
.g-blue{background:linear-gradient(#6DCEFF,#2F95F2 55%,#1C72DA);box-shadow:inset 0 -3px 0 rgba(0,0,0,.14),0 5px 0 #0D4A9E,0 9px 14px rgba(0,20,60,.35)}
.g-gold{color:#5A2E00;text-shadow:0 1px 0 rgba(255,255,255,.55);background:linear-gradient(#FFEC8F,#FFC61F 55%,#F59E00);box-shadow:inset 0 -3px 0 rgba(0,0,0,.1),0 5px 0 #B26400,0 9px 14px rgba(0,20,60,.35)}
.pnl{background:linear-gradient(#2064CC,#1549A6);border-radius:24px;box-shadow:inset 0 0 0 3px #3F86EA,inset 0 5px 0 rgba(255,255,255,.16),0 6px 0 #0A2E70,0 12px 22px rgba(0,10,40,.4)}
.well{background:#0D3680;border-radius:14px;box-shadow:inset 0 3px 6px rgba(0,0,0,.4),inset 0 -1px 0 rgba(255,255,255,.14)}
.lm-rays{animation:lmRays 24s linear infinite;transform-origin:50% 50%}
.lm-slam{animation:lmSlam 700ms var(--b) backwards}
.lm-grow{animation:lmGrow 700ms var(--b) backwards;transform-origin:50% 100%}
.lm-drop{animation:lmDrop 700ms var(--b) backwards}
.lm-fall{animation:lmFall linear infinite}
.lm-rise{animation:lmRise 460ms var(--e) backwards}
.lm-bar{transition:width 900ms cubic-bezier(.2,.8,.2,1)}
.lm-wobble{animation:lmWobble 1.4s ease-in-out infinite}
.lm-pop{animation:lmPop 520ms var(--b) backwards}
.lm-float{animation:lmFloat 2.6s ease-in-out infinite}

@keyframes lmSlam{0%{opacity:0;transform:scale(2.6) rotate(-8deg)}60%{opacity:1;transform:scale(.92)}100%{transform:scale(1)}}
@keyframes lmGrow{from{transform:scaleY(0)}}
@keyframes lmDrop{from{opacity:0;transform:translateY(-60px)}}
@keyframes lmFall{from{transform:translateY(-40px) rotate(0)}to{transform:translateY(900px) rotate(540deg)}}
@keyframes lmRise{from{opacity:0;transform:translateY(16px)}}
@keyframes lmWobble{0%,70%,100%{transform:rotate(0) scale(1)}76%{transform:rotate(-8deg) scale(1.06)}82%{transform:rotate(7deg) scale(1.06)}88%{transform:rotate(-4deg)}94%{transform:rotate(3deg)}}
@keyframes lmPop{from{opacity:0;transform:scale(.3)}}
@keyframes lmFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion: reduce){*{animation-duration:1ms !important;animation-delay:0ms !important;animation-iteration-count:1 !important;transition-duration:1ms !important}}
.av-blink,.av-earl,.av-earr{transform-box:view-box}.av-blink{animation:avBlink 4.2s infinite}.av-earl{animation:avEarL 5s infinite}.av-earr{animation:avEarR 5s 1.4s infinite}@keyframes avBlink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}@keyframes avEarL{0%,84%,100%{transform:rotate(0)}88%{transform:rotate(-9deg)}93%{transform:rotate(5deg)}}@keyframes avEarR{0%,84%,100%{transform:rotate(0)}88%{transform:rotate(9deg)}93%{transform:rotate(-5deg)}}
</style>

<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#1250C2;font-family:'Baloo 2',system-ui,sans-serif;color:#FFFFFF">
  <div style="position:absolute;inset:0;background:radial-gradient(90% 45% at 50% 26%,#9AD6FF 0%,#2F8BF0 35%,#1250C2 65%,#0A2C80 100%)"></div>
  <svg class="lm-rays" width="900" height="900" viewBox="-450 -450 900 900" aria-hidden="true" style="position:absolute;left:-255px;top:-230px"><sc-for list="{{rays}}" as="r" hint-placeholder-count="16"><path d="M0 0L-38 -450L38 -450z" fill="#FFFFFF" fill-opacity=".08" transform="rotate({{r}})"></path></sc-for></svg>
  <div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;z-index:3">
    <sc-for list="{{confetti}}" as="c" hint-placeholder-count="24"><span class="lm-fall" style="position:absolute;left:{{c.x}}px;top:0;width:{{c.w}}px;height:{{c.h}}px;border-radius:2px;background:{{c.c}};animation-duration:{{c.t}};animation-delay:{{c.d}}"></span></sc-for>

    <div style="height:54px;flex:none"></div>
    <div class="lm-slam" style="width:330px;height:92px;flex:none" role="img" aria-label="You won">
      <svg width="330" height="92" viewBox="0 0 330 92" aria-hidden="true"><defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF6B0"></stop><stop offset=".5" stop-color="#FFC61F"></stop><stop offset="1" stop-color="#F08A00"></stop></linearGradient></defs><text x="165" y="72" text-anchor="middle" font-family="Lilita One" font-size="68" fill="#5A2E00" stroke="#5A2E00" stroke-width="12" stroke-linejoin="round" transform="translate(0 5)">YOU WON!</text><text x="165" y="72" text-anchor="middle" font-family="Lilita One" font-size="68" fill="url(#wg)" stroke="#7A3A00" stroke-width="5" stroke-linejoin="round" paint-order="stroke">YOU WON!</text></svg>
    </div>
    <span class="ttl lm-rise" style="font-size:15px;color:#DDEEFF;animation-delay:300ms">Lantern Bazaar · 4 players · 21 turns</span>

    <div style="position:relative;width:340px;height:236px;flex:none;margin-top:8px">
      <svg class="lm-float" width="70" height="70" viewBox="0 0 70 80" aria-hidden="true" style="position:absolute;left:135px;top:0"><path d="M18 6h34v22a17 17 0 0 1-34 0z" fill="#FFD34D" stroke="#8A5300" stroke-width="3"></path><path d="M18 12H6v6a12 12 0 0 0 12 12M52 12h12v6a12 12 0 0 1-12 12" fill="none" stroke="#8A5300" stroke-width="3"></path><path d="M30 44h10v14H30z" fill="#E0A800" stroke="#8A5300" stroke-width="3"></path><rect x="18" y="58" width="34" height="12" rx="3" fill="#B5651D" stroke="#6B3A0E" stroke-width="3"></rect><path d="M35 14l3 6 6.5.6-5 4.4 1.5 6.4L35 28l-6 3.4 1.5-6.4-5-4.4 6.5-.6z" fill="#FFF6E6"></path></svg>
      <sc-for list="{{podium}}" as="p" hint-placeholder-count="3">
        <div style="position:absolute;left:{{p.x}}px;bottom:0;width:104px;display:flex;flex-direction:column;align-items:center">
          <span class="lm-drop" style="position:relative;width:{{p.size}}px;height:{{p.size}}px;border-radius:18px;overflow:hidden;box-shadow:0 0 0 3px #FFFFFF,0 0 0 6px {{p.ring}},0 8px 12px rgba(0,0,0,.35);margin-bottom:12px;animation-delay:{{p.dropDelay}}">
            <svg width="{{p.size}}" height="{{p.size}}" viewBox="0 0 48 48" aria-hidden="true"><sc-for list="{{p.av}}" as="q" hint-placeholder-count="10"><path class="{{q.c}}" style="transform-origin:{{q.o}}" d="{{q.d}}" fill="{{q.f}}" stroke="{{q.s}}" stroke-width="{{q.w}}" stroke-linecap="round" stroke-linejoin="round"></path></sc-for></svg>
          </span>
          <div class="lm-grow" style="position:relative;width:104px;height:{{p.h}}px;animation-delay:{{p.growDelay}}">
            <div style="position:absolute;left:6px;right:6px;top:0;height:14px;border-radius:8px 8px 2px 2px;background:{{p.top}};transform:perspective(200px) rotateX(40deg);transform-origin:50% 100%"></div>

        </div>

    </div>
    <span class="lm-rise" style="font:800 12px 'Baloo 2',sans-serif;color:#CFE3FF;margin-top:8px;animation-delay:900ms">4th · Mitu — every puck but one home</span>

        </div>
        <button type="button" onClick="{{openChest}}" aria-label="{{chestLabel}}" class="well" style="width:120px;height:56px;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;padding:0;color:#FFFFFF">

            <span class="ttl" style="font-size:14px;line-height:1.05;text-align:left">Silver<br>pot</span>
          </sc-if>
          <sc-if value="{{opened}}" hint-placeholder-val="{{ false }}">
            <span class="lm-pop" style="display:flex;align-items:center;gap:4px"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h12l4.5 6L12 21.5 1.5 9.5z" fill="#C2186D"></path><path d="M6 3.5h12l4.5 6H1.5z" fill="#FF6CC0"></path><path d="M12 21.5L1.5 9.5h21z" fill="#F0328F"></path></svg><span class="ttl" style="font-size:20px;color:#FF9AD6">+5</span></span>

        </button>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <svg width="34" height="34" viewBox="0 0 28 28" aria-hidden="true"><path d="M14 1.5l3.6 7.4 8.1 1.2-5.9 5.7 1.4 8.1L14 20.1l-7.2 3.8 1.4-8.1-5.9-5.7 8.1-1.2z" fill="#FFC61F" stroke="#B26400" stroke-width="2" stroke-linejoin="round"></path><text x="14" y="18.5" text-anchor="middle" font-family="Lilita One" font-size="11" fill="#FFFFFF" stroke="#8A4B00" stroke-width="2.4" paint-order="stroke">{{lv}}</text></svg>

      <div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center">
        <sc-for list="{{story}}" as="s" hint-placeholder-count="3"><span style="height:26px;border-radius:13px;background:rgba(255,255,255,.14);font:800 12px/26px 'Baloo 2',sans-serif;padding:0 10px">{{s}}</span></sc-for>
      </div>
    </div>

    <div style="flex:1"></div>
    <div style="width:358px;display:flex;gap:10px;flex:none">
      <a href="Main.dc.html" aria-label="Back to lobby" class="gl g-blue" style="width:58px;height:58px;border-radius:18px;flex:none"><svg width="28" height="28" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true" style="position:relative;z-index:1"><path d="M12 3l9 8h-3v9h-4.5v-6h-3v6H6v-9H3z"></path></svg></a>

    </div>
    <div style="height:40px;flex:none"></div>
  </div>
</div>

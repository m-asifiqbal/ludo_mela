<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ludo Mela — Match insights</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFE27A}a:hover{color:#FFF3B8}
:root{--e:cubic-bezier(.2,.8,.2,1);--b:cubic-bezier(.34,1.56,.64,1)}
button,a{-webkit-tap-highlight-color:transparent;transition:transform 150ms var(--b),filter 160ms var(--e),box-shadow 160ms var(--e),opacity 160ms var(--e)}
button:focus-visible,a:focus-visible{outline:3px solid #FFFFFF;outline-offset:3px}
.ttl{font-family:'Lilita One',sans-serif;font-weight:400;color:#FFFFFF;letter-spacing:.4px;text-shadow:0 -1.5px 0 #0A2A6B,1.5px 0 0 #0A2A6B,0 1.5px 0 #0A2A6B,-1.5px 0 0 #0A2A6B,1.2px 1.2px 0 #0A2A6B,-1.2px 1.2px 0 #0A2A6B,1.2px -1.2px 0 #0A2A6B,-1.2px -1.2px 0 #0A2A6B,0 3px 0 #0A2A6B}
.gl{position:relative;border:0;cursor:pointer;font-family:'Lilita One',sans-serif;font-weight:400;color:#FFFFFF;letter-spacing:.4px;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;text-shadow:0 2px 0 rgba(0,0,0,.3);box-sizing:border-box}
.gl::after{content:'';position:absolute;left:8%;right:8%;top:3px;height:42%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,0));pointer-events:none}
.gl:active{transform:translateY(3px) scale(.98)}
.g-blue{background:linear-gradient(#6DCEFF,#2F95F2 55%,#1C72DA);box-shadow:inset 0 -3px 0 rgba(0,0,0,.14),0 4px 0 #0D4A9E,0 8px 12px rgba(0,20,60,.3)}
.g-gold{color:#5A2E00;text-shadow:0 1px 0 rgba(255,255,255,.55);background:linear-gradient(#FFEC8F,#FFC61F 55%,#F59E00);box-shadow:inset 0 -3px 0 rgba(0,0,0,.1),0 5px 0 #B26400,0 9px 14px rgba(0,20,60,.35)}
.g-green{background:linear-gradient(#8DEB50,#47BA2B 55%,#2E9A1B);box-shadow:inset 0 -3px 0 rgba(0,0,0,.14),0 5px 0 #1D6B0F,0 9px 14px rgba(0,20,60,.35)}
.pnl{background:linear-gradient(#2064CC,#1549A6);border-radius:22px;box-shadow:inset 0 0 0 3px #3F86EA,inset 0 5px 0 rgba(255,255,255,.16),0 6px 0 #0A2E70,0 12px 22px rgba(0,10,40,.4)}
.well{background:#0D3680;border-radius:14px;box-shadow:inset 0 3px 6px rgba(0,0,0,.4),inset 0 -1px 0 rgba(255,255,255,.14)}
.lm-draw{stroke-dasharray:600;animation:lmDraw 1.4s var(--e) backwards}
.lm-rise{animation:lmRise 420ms var(--e) backwards}
@keyframes lmDraw{from{stroke-dashoffset:600}}
@keyframes lmRise{from{opacity:0;transform:translateY(12px)}}
@media (prefers-reduced-motion: reduce){*{animation-duration:1ms !important;animation-delay:0ms !important;animation-iteration-count:1 !important;transition-duration:1ms !important}}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#1250C2;font-family:'Baloo 2',system-ui,sans-serif;color:#FFFFFF">
  <div style="position:absolute;inset:0;background:radial-gradient(130% 70% at 50% 30%,#3E9CFA 0%,#1F6EE0 40%,#1250C2 70%,#0B3592 100%)"></div>
  <svg width="390" height="844" aria-hidden="true" style="position:absolute;inset:0"><defs><pattern id="jali" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M22 8l14 14-14 14L8 22zM12.5 12.5h19v19h-19z" fill="none" stroke="#FFFFFF" stroke-opacity=".07" stroke-width="1.6"></path></pattern></defs><rect width="390" height="844" fill="url(#jali)"></rect></svg>

  <div style="position:relative;z-index:1;height:100%;display:flex;flex-direction:column">
    <div style="height:47px;flex:none"></div>
    <div style="flex:none;height:58px;background:linear-gradient(#5ED8FF,#1FA2EE);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),inset 0 -4px 0 #0E78C2,0 4px 10px rgba(0,0,0,.25);display:flex;align-items:center;padding:0 10px;gap:8px">
      <a href="Win.dc.html" aria-label="Back to results" class="gl g-blue" style="width:42px;height:42px;border-radius:14px;flex:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position:relative;z-index:1"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <h1 class="ttl" style="margin:0;flex:1;font-size:24px;text-align:center;padding-right:50px">MATCH INSIGHTS</h1>
    </div>

    <div style="flex:1;min-height:0;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:14px">
      <div style="flex:none;display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
        <sc-for list="{{chips}}" as="c" hint-placeholder-count="4"><span class="well" style="height:30px;border-radius:15px;font:800 12px/30px 'Baloo 2',sans-serif;padding:0 12px">{{c}}</span></sc-for>
      </div>

      <div class="pnl lm-rise" style="flex:none;padding:12px">
        <div style="display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 8px"><span class="ttl" style="font-size:17px">The race</span><span style="font:800 11px 'Baloo 2',sans-serif;color:#9CC2FF">% of the way home, by turn</span></div>
        <svg width="342" height="170" viewBox="0 0 342 170" role="img" aria-label="{{chartLabel}}">
          <rect x="28" y="6" width="306" height="140" rx="10" fill="#0D3680"></rect>
          <sc-for list="{{grid}}" as="g" hint-placeholder-count="4"><path d="{{g.d}}" stroke="#FFFFFF" stroke-opacity=".12" stroke-width="1"></path><text x="22" y="{{g.ty}}" text-anchor="end" font-family="Baloo 2" font-weight="800" font-size="10" fill="#9CC2FF">{{g.t}}</text></sc-for>
          <sc-for list="{{lines}}" as="l" hint-placeholder-count="4"><path class="lm-draw" d="{{l.d}}" fill="none" stroke="{{l.c}}" stroke-width="{{l.w}}" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:{{l.delay}}"></path></sc-for>
          <sc-for list="{{marks}}" as="m" hint-placeholder-count="3"><g transform="translate({{m.x}} {{m.y}})"><circle r="8" fill="#FFFFFF" stroke="{{m.c}}" stroke-width="3"></circle><text y="3.5" text-anchor="middle" font-family="Lilita One" font-size="10" fill="{{m.c}}">{{m.t}}</text></g></sc-for>
          <text x="28" y="164" font-family="Baloo 2" font-weight="800" font-size="10" fill="#9CC2FF">Turn 1</text>
          <text x="334" y="164" text-anchor="end" font-family="Baloo 2" font-weight="800" font-size="10" fill="#9CC2FF">Turn 21</text>
        </svg>
        <div style="display:flex;gap:12px;justify-content:center;margin-top:4px">
          <sc-for list="{{legend}}" as="l" hint-placeholder-count="4"><span style="display:flex;align-items:center;gap:5px;font:800 12px 'Baloo 2',sans-serif"><span style="width:14px;height:5px;border-radius:3px;background:{{l.c}}"></span>{{l.nm}}</span></sc-for>
        </div>
      </div>

      <div style="flex:none;display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:10px">
        <sc-for list="{{stats}}" as="s" hint-placeholder-count="6">
          <div class="pnl lm-rise" style="height:86px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;animation-delay:{{s.d}}">
            <span class="ttl" style="font-size:26px;color:{{s.c}}">{{s.v}}</span>
            <span style="font:800 11.5px/1.2 'Baloo 2',sans-serif;color:#CFE3FF;text-align:center">{{s.l}}</span>
          </div>
        </sc-for>
      </div>

      <div class="pnl" style="flex:none;padding:12px 12px 6px">
        <span class="ttl" style="font-size:17px;display:block;margin:0 2px 6px">Key moments</span>
        <sc-for list="{{moments}}" as="m" hint-placeholder-count="4">
          <div style="min-height:52px;display:flex;align-items:center;gap:10px;border-top:1px solid {{m.line}}">
            <span style="width:36px;height:36px;border-radius:12px;background:{{m.bg}};display:grid;place-items:center;flex:none;box-shadow:0 3px 0 rgba(0,0,0,.3)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.icon}}"></path></svg></span>
            <span style="flex:1;font:700 13px/1.3 'Baloo 2',sans-serif"><b style="font-weight:800;color:#FFE27A">Turn {{m.turn}} ·</b> {{m.text}}</span>
          </div>
        </sc-for>
      </div>

      <div class="pnl" style="flex:none;padding:12px;display:flex;gap:12px;align-items:center">
        <svg width="74" height="74" viewBox="0 0 74 74" role="img" aria-label="Smart moves 86 percent"><circle cx="37" cy="37" r="30" fill="none" stroke="#0D3680" stroke-width="10"></circle><circle class="lm-draw" cx="37" cy="37" r="30" fill="none" stroke="#8DEB50" stroke-width="10" stroke-linecap="round" stroke-dasharray="162 189" transform="rotate(-90 37 37)"></circle><text x="37" y="43" text-anchor="middle" font-family="Lilita One" font-size="18" fill="#FFFFFF">86%</text></svg>
        <span style="flex:1;display:flex;flex-direction:column;gap:2px"><span class="ttl" style="font-size:16px">Smart moves</span><span style="font:700 12.5px/1.35 'Baloo 2',sans-serif;color:#DDEEFF">26 of your 30 moves matched the Expert bot's pick. Turn 14 cost you most: the 5 into Raja's reach.</span></span>
      </div>
    </div>

    <div style="flex:none;padding:12px 12px 0;background:linear-gradient(rgba(11,44,116,0),#0B2C74 35%);display:flex;gap:10px">
      <a href="Match.dc.html" class="gl g-gold" style="flex:1;height:56px;border-radius:18px;font-size:18px"><svg width="20" height="20" viewBox="0 0 24 24" fill="#5A2E00" aria-hidden="true" style="position:relative;z-index:1"><path d="M7 4l13 8-13 8z"></path></svg><span style="position:relative;z-index:1">WATCH REPLAY</span></a>
      <a href="VsIntro.dc.html" class="gl g-green" style="flex:1;height:56px;border-radius:18px;font-size:18px"><span style="position:relative;z-index:1">PLAY AGAIN</span></a>
    </div>
    <div style="height:34px;flex:none;background:#0B2C74"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const SERIES = [
  ['You', '#FF6B5E', [0, 4, 8, 8, 14, 20, 22, 30, 34, 40, 46, 46, 52, 56, 60, 66, 74, 80, 86, 94, 100]],
  ['Raja', '#8DEB50', [0, 6, 10, 16, 18, 24, 30, 36, 40, 32, 34, 40, 46, 52, 58, 62, 64, 70, 74, 78, 82]],
  ['Mitu', '#FFD84F', [0, 2, 6, 10, 12, 16, 20, 22, 26, 30, 34, 36, 40, 44, 46, 50, 54, 56, 60, 62, 66]],
  ['Tara', '#7CC6FF', [0, 6, 12, 18, 24, 18, 22, 28, 34, 40, 44, 50, 54, 48, 52, 58, 62, 66, 70, 72, 76]]
];
class Component extends DCLogic {
  renderVals() {
    const X0 = 34; const X1 = 328; const Y0 = 140; const Y1 = 12;
    const px = (i) => X0 + (i / 20) * (X1 - X0);
    const py = (v) => Y0 - (v / 100) * (Y0 - Y1);
    const lines = SERIES.map((s, k) => ({
      c: s[1], w: k === 0 ? 4 : 2.6, delay: (k * 150) + 'ms',
      d: s[2].map((v, i) => (i ? 'L' : 'M') + px(i).toFixed(1) + ' ' + py(v).toFixed(1)).join(' ')
    }));
    const grid = [0, 25, 50, 75, 100].map((v) => ({ d: 'M28 ' + py(v).toFixed(1) + 'H334', ty: (py(v) + 3).toFixed(1), t: v }));
    const marks = [[4, 14, '#FF6B5E', 'C'], [9, 32, '#8DEB50', 'C'], [13, 48, '#FF6B5E', 'C']].map((m) => ({ x: px(m[0]).toFixed(1), y: py(m[1] + 6).toFixed(1), c: m[2], t: m[3] }));
    return {
      chips: ['1st place', 'Lantern Bazaar', '21 turns', '14 min'],
      grid, lines, marks,
      chartLabel: 'Race chart. You led from turn 13 and finished first. Raja led early, Tara was second at turn 12.',
      legend: SERIES.map((s) => ({ nm: s[0], c: s[1] })),
      stats: [['38', 'Rolls', '#FFFFFF'], ['7', 'Sixes', '#FFE27A'], ['3', 'Captures', '#FF9A8A'], ['1', 'Times captured', '#CFE3FF'], ['3.6', 'Avg roll (fair: 3.5)', '#A3F06A'], ['9', 'First puck home (turn)', '#7CC6FF']]
        .map((s, i) => ({ v: s[0], l: s[1], c: s[2], d: (i * 40) + 'ms' })),
      moments: [
        ['5', 'You captured Tara from 4 squares away', '#D22A21', 'M12 3l2.5 5.5 6 .6-4.5 4 1.3 5.9L12 16l-5.3 3 1.3-5.9-4.5-4 6-.6z'],
        ['10', 'Raja captured your lead puck — ouch', '#6A35D6', 'M6 6l12 12M18 6L6 18'],
        ['13', 'Six, six, four — you took the lead', '#E89A00', 'M4 4h16v16H4zM8.5 8.5h.01M15.5 15.5h.01'],
        ['21', 'Last puck home with an exact 3', '#2E9A1B', 'M5 12.5l4.5 4.5L19 7']
      ].map((m, i) => ({ turn: m[0], text: m[1], bg: m[2], icon: m[3], line: i ? 'rgba(255,255,255,.14)' : 'transparent' }))
    };
  }
}
</script>
</body>
</html>

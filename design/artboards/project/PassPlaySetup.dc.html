<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ludo Mela — Pass and play</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFE27A}a:hover{color:#FFF3B8}
:root{--e:cubic-bezier(.2,.8,.2,1);--b:cubic-bezier(.34,1.56,.64,1)}
button,a{-webkit-tap-highlight-color:transparent;transition:transform 150ms var(--b),filter 160ms var(--e),box-shadow 160ms var(--e),opacity 160ms var(--e)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #FFFFFF;outline-offset:3px}
.ttl{font-family:'Lilita One',sans-serif;font-weight:400;color:#FFFFFF;letter-spacing:.4px;text-shadow:0 -1.5px 0 #0A2A6B,1.5px 0 0 #0A2A6B,0 1.5px 0 #0A2A6B,-1.5px 0 0 #0A2A6B,1.2px 1.2px 0 #0A2A6B,-1.2px 1.2px 0 #0A2A6B,1.2px -1.2px 0 #0A2A6B,-1.2px -1.2px 0 #0A2A6B,0 3px 0 #0A2A6B}
.gl{position:relative;border:0;cursor:pointer;font-family:'Lilita One',sans-serif;font-weight:400;color:#FFFFFF;letter-spacing:.4px;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;text-shadow:0 2px 0 rgba(0,0,0,.3);box-sizing:border-box}
.gl::after{content:'';position:absolute;left:8%;right:8%;top:3px;height:42%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,0));pointer-events:none}
.gl:active{transform:translateY(3px) scale(.98)}
.g-green{background:linear-gradient(#8DEB50,#47BA2B 55%,#2E9A1B);box-shadow:inset 0 -3px 0 rgba(0,0,0,.14),0 5px 0 #1D6B0F,0 9px 14px rgba(0,20,60,.35)}
.g-blue{background:linear-gradient(#6DCEFF,#2F95F2 55%,#1C72DA);box-shadow:inset 0 -3px 0 rgba(0,0,0,.14),0 4px 0 #0D4A9E,0 8px 12px rgba(0,20,60,.3)}
.g-gold{color:#5A2E00;text-shadow:0 1px 0 rgba(255,255,255,.55);background:linear-gradient(#FFEC8F,#FFC61F 55%,#F59E00);box-shadow:inset 0 -3px 0 rgba(0,0,0,.1),0 4px 0 #B26400,0 8px 12px rgba(0,20,60,.3)}
.pnl{background:linear-gradient(#2064CC,#1549A6);border-radius:22px;box-shadow:inset 0 0 0 3px #3F86EA,inset 0 5px 0 rgba(255,255,255,.16),0 6px 0 #0A2E70,0 12px 22px rgba(0,10,40,.4)}
.well{background:#0D3680;border-radius:14px;box-shadow:inset 0 3px 6px rgba(0,0,0,.4),inset 0 -1px 0 rgba(255,255,255,.14)}
.lm-rise{animation:lmRise 420ms var(--e) backwards}
@keyframes lmRise{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion: reduce){*{animation-duration:1ms !important;animation-delay:0ms !important;animation-iteration-count:1 !important;transition-duration:1ms !important}}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#1250C2;font-family:'Baloo 2',system-ui,sans-serif;color:#FFFFFF">
  <div style="position:absolute;inset:0;background:radial-gradient(130% 70% at 50% 30%,#3E9CFA 0%,#1F6EE0 40%,#1250C2 70%,#0B3592 100%)"></div>
  <svg width="390" height="844" aria-hidden="true" style="position:absolute;inset:0"><defs><pattern id="jali" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M22 8l14 14-14 14L8 22zM12.5 12.5h19v19h-19z" fill="none" stroke="#FFFFFF" stroke-opacity=".07" stroke-width="1.6"></path></pattern></defs><rect width="390" height="844" fill="url(#jali)"></rect></svg>

  <div style="position:relative;z-index:1;height:100%;display:flex;flex-direction:column">
    <div style="height:47px;flex:none"></div>
    <div style="flex:none;height:58px;background:linear-gradient(#8DEB50,#3DA828);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),inset 0 -4px 0 #1D7A10,0 4px 10px rgba(0,0,0,.25);display:flex;align-items:center;padding:0 10px;gap:8px">
      <a href="Main.dc.html" aria-label="Back to lobby" class="gl g-blue" style="width:42px;height:42px;border-radius:14px;flex:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position:relative;z-index:1"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <h1 class="ttl" style="margin:0;flex:1;font-size:26px;text-align:center;padding-right:50px">PASS &amp; PLAY</h1>
    </div>

    <div style="flex:1;min-height:0;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:14px">
      <div role="radiogroup" aria-label="Number of players" style="flex:none;display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:10px">
        <sc-for list="{{counts}}" as="c" hint-placeholder-count="3">
          <button type="button" role="radio" aria-checked="{{c.checked}}" onClick="{{c.pick}}" class="gl {{c.cls}}" style="height:58px;border-radius:18px;flex-direction:column;gap:0;font-size:24px"><span style="position:relative;z-index:1;line-height:1">{{c.n}}</span><span style="position:relative;z-index:1;font-size:12px;line-height:1.2">PLAYERS</span></button>
        </sc-for>
      </div>

      <div class="pnl" style="flex:none;padding:10px 12px 12px">
        <span class="ttl" style="font-size:17px;display:block;margin:2px 0 8px 2px">Who's playing?</span>
        <div style="display:flex;flex-direction:column;gap:8px">
          <sc-for list="{{seats}}" as="s" hint-placeholder-count="4">
            <div class="lm-rise" style="height:56px;display:flex;align-items:center;gap:10px">
              <span style="position:relative;width:40px;height:40px;flex:none">
                <span style="position:absolute;inset:0;border-radius:50%;background:{{s.side}};transform:translateY(4px)"></span>
                <span style="position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 28%,{{s.light}} 0%,{{s.mid}} 62%,{{s.dark}} 100%);box-shadow:inset 0 0 0 3px #FFFFFF,inset 0 0 0 4.5px {{s.dark}}"></span>
              </span>
              <label for="{{s.id}}" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">{{s.colour}} player name</label>
              <input id="{{s.id}}" type="text" maxlength="14" value="{{s.nm}}" placeholder="Tap to add a name" onChange="{{s.type}}" class="well" style="flex:1;min-width:0;height:46px;border:0;color:#FFFFFF;font:800 16px 'Baloo 2',sans-serif;padding:0 14px;box-sizing:border-box;outline:none">
              <span class="ttl" style="font-size:13px;width:46px;text-align:right">{{s.colour}}</span>
            </div>
          </sc-for>
        </div>
        <span style="display:block;font:800 12px 'Baloo 2',sans-serif;color:#CFE3FF;margin:12px 2px 6px">Saved family players — tap to seat</span>
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          <sc-for list="{{saved}}" as="p" hint-placeholder-count="3">
            <button type="button" onClick="{{p.seat}}" class="gl g-blue" style="height:40px;border-radius:20px;font-size:14px;padding:0 12px 0 5px"><span style="position:relative;z-index:1;width:30px;height:30px;border-radius:15px;background:{{p.bg}};color:#0A2A6B;font:400 15px/30px 'Lilita One',sans-serif;text-align:center;text-shadow:none" aria-hidden="true">{{p.i}}</span><span style="position:relative;z-index:1">{{p.nm}}</span></button>
          </sc-for>
          <a href="Profile.dc.html" class="well" style="height:40px;border-radius:20px;color:#FFE27A;font:800 13px/40px 'Baloo 2',sans-serif;padding:0 14px;text-decoration:none">+ Add</a>
        </div>
      </div>

      <div class="pnl" style="flex:none;padding:6px 12px">
        <sc-for list="{{opts}}" as="o" hint-placeholder-count="2">
          <button type="button" role="switch" aria-checked="{{o.checked}}" onClick="{{o.toggle}}" style="width:100%;min-height:62px;border:0;background:transparent;border-top:1px solid {{o.line}};display:flex;align-items:center;gap:12px;color:#FFFFFF;cursor:pointer;text-align:left;padding:6px 0">
            <span style="flex:1;display:flex;flex-direction:column;gap:1px"><span class="ttl" style="font-size:16px">{{o.title}}</span><span style="font:700 12px/1.3 'Baloo 2',sans-serif;color:#CFE3FF">{{o.sub}}</span></span>
            <span style="position:relative;width:54px;height:32px;border-radius:16px;background:{{o.bg}};box-shadow:inset 0 2px 4px rgba(0,0,0,.35);flex:none"><span style="position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:13px;background:linear-gradient(#FFFFFF,#DDE6F2);box-shadow:0 2px 0 rgba(0,0,0,.25);transform:translateX({{o.x}}px);transition:transform 220ms cubic-bezier(.34,1.56,.64,1)"></span></span>
          </button>
        </sc-for>
      </div>

      <div class="pnl" style="flex:none;padding:10px 12px 6px">
        <span class="ttl" style="font-size:17px;display:block;margin:2px 0 4px 2px">House rules</span>
        <sc-for list="{{rules}}" as="o" hint-placeholder-count="6">
          <button type="button" role="switch" aria-checked="{{o.checked}}" onClick="{{o.toggle}}" style="width:100%;min-height:58px;border:0;background:transparent;border-top:1px solid {{o.line}};display:flex;align-items:center;gap:12px;color:#FFFFFF;cursor:pointer;text-align:left;padding:6px 0">
            <span style="flex:1;display:flex;flex-direction:column;gap:1px"><span style="font:800 14px/1.25 'Baloo 2',sans-serif">{{o.title}}</span><span style="font:700 12px/1.3 'Baloo 2',sans-serif;color:#CFE3FF">{{o.sub}}</span></span>
            <span style="position:relative;width:54px;height:32px;border-radius:16px;background:{{o.bg}};box-shadow:inset 0 2px 4px rgba(0,0,0,.35);flex:none"><span style="position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:13px;background:linear-gradient(#FFFFFF,#DDE6F2);box-shadow:0 2px 0 rgba(0,0,0,.25);transform:translateX({{o.x}}px);transition:transform 220ms cubic-bezier(.34,1.56,.64,1)"></span></span>
          </button>
        </sc-for>
      </div>
      <span style="text-align:center;font:700 12px 'Baloo 2',sans-serif;color:#CFE3FF">Pass &amp; play is always free. Each saved player gets their own insights.</span>
    </div>

    <div style="flex:none;padding:12px 12px 0;background:linear-gradient(rgba(11,44,116,0),#0B2C74 35%)">
      <a href="{{startHref}}" class="gl g-green" style="height:60px;border-radius:20px;font-size:24px"><span style="position:relative;z-index:1">START · {{n}} PLAYERS</span></a>
    </div>
    <div style="height:34px;flex:none;background:#0B2C74"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const SEATS = [
  ['RED', '#FF8A7A', '#EC3B30', '#A71D16', '#7E120E'],
  ['GREEN', '#A3EC6A', '#43B32D', '#24781A', '#195A11'],
  ['YELLOW', '#FFEA7A', '#FFC21F', '#C88A00', '#8E6100'],
  ['BLUE', '#7CC6FF', '#2381EC', '#114FA8', '#0B3878']
];
const RULES = [
  ['six', 'Need a 6 to leave the yard', 'Off: a 1 or a 6 lets a puck out'],
  ['three', 'Three 6s in a row lose the turn', 'Stops endless sixes'],
  ['exact', 'Exact roll to reach home', 'Off: overshooting still counts'],
  ['block', 'Blockades', 'Two of your pucks on one square block everyone'],
  ['gentle', 'Gentle captures (kids)', 'A captured puck steps back 6 squares, not to the yard'],
  ['helper', 'Helping dice', 'Stuck in the yard for 5 rolls? The next roll is a 6 — shown to all']
];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { n: 4, names: ['Player', 'Nadia', '', ''], tabletop: true, timer: false, r: { six: true, three: true, exact: true, block: false, gentle: false, helper: true } };
  }
  renderVals() {
    const st = this.state;
    const counts = [2, 3, 4].map((n) => ({ n, checked: st.n === n ? 'true' : 'false', cls: st.n === n ? 'g-gold' : 'g-blue', pick: () => this.setState({ n }) }));
    const order = st.n === 2 ? [0, 2] : st.n === 3 ? [0, 1, 2] : [0, 1, 2, 3];
    const seats = order.map((si) => ({
      id: 'seat' + si, colour: SEATS[si][0], light: SEATS[si][1], mid: SEATS[si][2], dark: SEATS[si][3], side: SEATS[si][4],
      nm: st.names[si],
      type: (e) => { const names = this.state.names.slice(); names[si] = e.target.value; this.setState({ names }); }
    }));
    const saved = [['Rafi', '#7CC6FF'], ['Mim', '#FF9AD6'], ['Nani', '#A3EC6A']].map((p) => ({
      nm: p[0], i: p[0][0], bg: p[1],
      seat: () => {
        const names = this.state.names.slice();
        const free = order.find((si) => !names[si]);
        if (free !== undefined && !names.includes(p[0])) { names[free] = p[0]; this.setState({ names }); }
      }
    }));
    const sw = (on) => ({ checked: on ? 'true' : 'false', bg: on ? '#47BA2B' : '#3A5A94', x: on ? 22 : 0 });
    const opts = [
      Object.assign({ title: 'Tabletop mode', sub: 'Phone lies flat — each player’s dice and name face their side', line: 'transparent', toggle: () => this.setState({ tabletop: !this.state.tabletop }) }, sw(st.tabletop)),
      Object.assign({ title: 'Turn timer (20 s)', sub: 'Auto-moves the safest puck if time runs out', line: 'rgba(255,255,255,.14)', toggle: () => this.setState({ timer: !this.state.timer }) }, sw(st.timer))
    ];
    const rules = RULES.map((r, i) => Object.assign({
      title: r[1], sub: r[2], line: i ? 'rgba(255,255,255,.14)' : 'transparent',
      toggle: () => this.setState({ r: Object.assign({}, this.state.r, { [r[0]]: !this.state.r[r[0]] }) })
    }, sw(!!st.r[r[0]])));
    return { counts, seats, saved, opts, rules, n: st.n, startHref: st.tabletop ? 'Tabletop.dc.html' : 'Match.dc.html' };
  }
}
</script>
</body>
</html>

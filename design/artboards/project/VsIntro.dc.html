<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ludo Mela — VS</title>

<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFE27A}a:hover{color:#FFF3B8}
:root{--e:cubic-bezier(.2,.8,.2,1);--b:cubic-bezier(.34,1.56,.64,1)}
button,a{-webkit-tap-highlight-color:transparent;transition:transform 150ms var(--b),filter 160ms var(--e),box-shadow 160ms var(--e),opacity 160ms var(--e)}
button:focus-visible,a:focus-visible{outline:3px solid #FFFFFF;outline-offset:3px}
button:disabled{cursor:default}
.ttl{font-family:'Lilita One',sans-serif;font-weight:400;color:#FFFFFF;letter-spacing:.4px;text-shadow:0 -1.5px 0 #0A2A6B,1.5px 0 0 #0A2A6B,0 1.5px 0 #0A2A6B,-1.5px 0 0 #0A2A6B,1.2px 1.2px 0 #0A2A6B,-1.2px 1.2px 0 #0A2A6B,1.2px -1.2px 0 #0A2A6B,-1.2px -1.2px 0 #0A2A6B,0 3px 0 #0A2A6B}
.gl{position:relative;border:0;cursor:pointer;font-family:'Lilita One',sans-serif;font-weight:400;color:#FFFFFF;letter-spacing:.4px;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;text-shadow:0 2px 0 rgba(0,0,0,.3);box-sizing:border-box}
.gl::after{content:'';position:absolute;left:8%;right:8%;top:3px;height:42%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,0));pointer-events:none}
.gl:active{transform:translateY(3px) scale(.98)}
.g-green{background:linear-gradient(#8DEB50,#47BA2B 55%,#2E9A1B);box-shadow:inset 0 -3px 0 rgba(0,0,0,.14),0 5px 0 #1D6B0F,0 9px 14px rgba(0,20,60,.35)}
.g-gold{color:#5A2E00;text-shadow:0 1px 0 rgba(255,255,255,.55);background:linear-gradient(#FFEC8F,#FFC61F 55%,#F59E00);box-shadow:inset 0 -3px 0 rgba(0,0,0,.1),0 5px 0 #B26400,0 9px 14px rgba(0,20,60,.35)}
.lm-rays{animation:lmRays 24s linear infinite;transform-origin:50% 50%}
.lm-inL{animation:lmInL 620ms var(--b) backwards}
.lm-inR{animation:lmInR 620ms var(--b) backwards}
.lm-slam{animation:lmSlam 700ms var(--b) backwards}
.lm-pop{animation:lmPop 460ms var(--b) backwards}
.lm-rattle{animation:lmRattle 120ms linear infinite}
.lm-glow{animation:lmGlow 1.2s ease-in-out infinite}
.lm-rise{animation:lmRise 460ms var(--e) backwards}
@keyframes lmRays{to{transform:rotate(360deg)}}
@keyframes lmInL{from{opacity:0;transform:translateX(-180px) rotate(-10deg)}}
@keyframes lmInR{from{opacity:0;transform:translateX(180px) rotate(10deg)}}
@keyframes lmSlam{0%{opacity:0;transform:scale(3) rotate(-12deg)}60%{opacity:1;transform:scale(.9) rotate(2deg)}100%{transform:scale(1) rotate(0)}}
@keyframes lmPop{from{opacity:0;transform:scale(.4)}}
@keyframes lmRattle{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes lmGlow{0%,100%{box-shadow:0 0 0 4px #FFC61F,0 0 0 4px rgba(255,198,31,.6),0 10px 20px rgba(0,0,0,.35)}50%{box-shadow:0 0 0 4px #FFC61F,0 0 0 16px rgba(255,198,31,0),0 10px 20px rgba(0,0,0,.35)}}
@keyframes lmRise{from{opacity:0;transform:translateY(16px)}}
@media (prefers-reduced-motion: reduce){*{animation-duration:1ms !important;animation-delay:0ms !important;animation-iteration-count:1 !important;transition-duration:1ms !important}}
.av-blink,.av-earl,.av-earr{transform-box:view-box}.av-blink{animation:avBlink 4.2s infinite}.av-earl{animation:avEarL 5s infinite}.av-earr{animation:avEarR 5s 1.4s infinite}@keyframes avBlink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}@keyframes avEarL{0%,84%,100%{transform:rotate(0)}88%{transform:rotate(-9deg)}93%{transform:rotate(5deg)}}@keyframes avEarR{0%,84%,100%{transform:rotate(0)}88%{transform:rotate(9deg)}93%{transform:rotate(-5deg)}}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#1250C2;font-family:'Baloo 2',system-ui,sans-serif;color:#FFFFFF">
  <div style="position:absolute;inset:0;background:radial-gradient(90% 55% at 50% 47%,#7CC8FF 0%,#2A82EE 35%,#1250C2 65%,#0A2C80 100%)"></div>
  <svg class="lm-rays" width="900" height="900" viewBox="-450 -450 900 900" aria-hidden="true" style="position:absolute;left:-255px;top:-55px"><sc-for list="{{rays}}" as="r" hint-placeholder-count="16"><path d="M0 0L-38 -450L38 -450z" fill="#FFFFFF" fill-opacity=".07" transform="rotate({{r}})"></path></sc-for></svg>

  <div style="position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center">
    <div style="height:56px;flex:none"></div>
    <div class="lm-rise" style="position:relative;width:290px;height:56px;flex:none">
      <svg width="290" height="56" viewBox="0 0 290 56" aria-hidden="true" style="position:absolute;inset:0"><path d="M16 10h258l-11 19 11 19H16l11-19z" fill="#000000" opacity=".25" transform="translate(0 4)"></path><path d="M16 8h258l-11 19 11 19H16l11-19z" fill="#8B55F0" stroke="#FFD45A" stroke-width="3" stroke-linejoin="round"></path><path d="M34 12h222" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"></path></svg>
      <span class="ttl" style="position:absolute;left:0;right:0;top:12px;text-align:center;font-size:23px;letter-spacing:1px">LANTERN BAZAAR</span>
    </div>
    <span class="lm-rise" style="font:800 13px 'Baloo 2',sans-serif;color:#DDEEFF;letter-spacing:.08em;margin-top:6px;animation-delay:80ms">CLASSIC · 4 PLAYERS · 15 S TURNS</span>

    <div style="position:relative;width:366px;height:470px;flex:none;margin-top:18px">
      <div style="position:absolute;inset:0;display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));grid-template-rows:repeat(2, minmax(0, 1fr));gap:18px">
        <sc-for list="{{players}}" as="p" hint-placeholder-count="4">
          <div class="{{p.enter}}" style="position:relative;border-radius:26px;background:linear-gradient(160deg,{{p.light}},{{p.dark}});box-shadow:inset 0 0 0 3px rgba(255,255,255,.35),inset 0 5px 0 rgba(255,255,255,.25),0 6px 0 {{p.edge}},0 14px 22px rgba(0,10,40,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;animation-delay:{{p.delay}}">
            <span class="{{p.glow}}" style="position:relative;width:84px;height:84px;border-radius:22px;overflow:hidden;box-shadow:0 0 0 4px #FFFFFF,0 8px 14px rgba(0,0,0,.35)">
              <svg width="84" height="84" viewBox="0 0 48 48" aria-hidden="true"><sc-for list="{{p.av}}" as="q" hint-placeholder-count="10"><path class="{{q.c}}" style="transform-origin:{{q.o}}" d="{{q.d}}" fill="{{q.f}}" stroke="{{q.s}}" stroke-width="{{q.w}}" stroke-linecap="round" stroke-linejoin="round"></path></sc-for></svg>
            </span>
            <span class="ttl" style="font-size:21px">{{p.nm}}</span>
            <span style="height:22px;border-radius:11px;background:rgba(0,0,0,.28);font:800 11px/22px 'Baloo 2',sans-serif;letter-spacing:.06em;padding:0 10px">{{p.tag}}</span>
            <span class="{{p.diceAnim}}" role="img" aria-label="{{p.diceLabel}}" style="width:42px;height:42px;border-radius:11px;background:radial-gradient(circle at 50% 35%,#FFFFFF 0 55%,#E1E6EF 100%);box-shadow:inset 0 -4px 0 #C5CEDC,0 4px 8px rgba(0,0,0,.35);display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));grid-template-rows:repeat(3, minmax(0, 1fr));padding:6px;box-sizing:border-box;margin-top:2px">
              <sc-for list="{{p.pips}}" as="q" hint-placeholder-count="9"><span style="display:grid;place-items:center"><span style="width:7px;height:7px;border-radius:4px;background:{{q.ink}};opacity:{{q.on}}"></span></span></sc-for>
            </span>
            <sc-if value="{{p.first}}" hint-placeholder-val="{{ false }}"><span class="lm-pop gl g-gold" style="position:absolute;top:-14px;height:30px;border-radius:15px;font-size:14px;padding:0 12px"><span style="position:relative;z-index:1">GOES FIRST!</span></span></sc-if>
          </div>
        </sc-for>
      </div>
      <div class="lm-slam" style="position:absolute;left:50%;top:50%;width:150px;height:110px;margin:-55px 0 0 -75px;animation-delay:650ms" aria-hidden="true">
        <svg width="150" height="110" viewBox="0 0 150 110"><defs><linearGradient id="vsg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF6B0"></stop><stop offset=".5" stop-color="#FFC61F"></stop><stop offset="1" stop-color="#F08A00"></stop></linearGradient></defs><text x="75" y="86" text-anchor="middle" font-family="Lilita One" font-size="92" fill="#5A2E00" stroke="#5A2E00" stroke-width="14" stroke-linejoin="round" transform="translate(0 6)">VS</text><text x="75" y="86" text-anchor="middle" font-family="Lilita One" font-size="92" fill="url(#vsg)" stroke="#7A3A00" stroke-width="6" stroke-linejoin="round" paint-order="stroke">VS</text></svg>
      </div>
    </div>

    <div class="lm-rise" style="display:flex;align-items:center;gap:8px;margin-top:16px;animation-delay:900ms">
      <svg width="44" height="32" viewBox="0 0 40 30" aria-hidden="true"><circle cx="13" cy="17" r="8" fill="#B86E00"></circle><circle cx="13" cy="15.5" r="8" fill="#FFC928"></circle><circle cx="27" cy="17" r="8" fill="#B86E00"></circle><circle cx="27" cy="15.5" r="8" fill="#FFC928"></circle><circle cx="20" cy="11" r="8" fill="#B86E00"></circle><circle cx="20" cy="9.5" r="8" fill="#FFC928"></circle><circle cx="20" cy="9.5" r="5.5" fill="#FFAE00" stroke="#FFE680" stroke-width="1.2"></circle></svg>
      <span class="ttl" style="font-size:24px;color:#FFE27A">PRIZE 1,000</span>
    </div>

    <div style="flex:1"></div>
    <div aria-live="polite" style="width:100%;padding:0 22px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px">
      <span class="ttl" style="text-align:center;font-size:15px;min-height:20px">{{status}}</span>
      <sc-if value="{{canRoll}}" hint-placeholder-val="{{ true }}">
        <button type="button" onClick="{{rollOff}}" disabled="{{rolling}}" class="gl g-gold" style="height:58px;border-radius:20px;font-size:22px"><span style="position:relative;z-index:1">{{rollText}}</span></button>
      </sc-if>
      <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
        <a href="Match.dc.html" class="gl g-green lm-pop" style="height:58px;border-radius:20px;font-size:24px"><span style="position:relative;z-index:1">LET'S GO!</span></a>
      </sc-if>
    </div>
    <div style="height:44px;flex:none"></div>
  </div>
</div>
</x-dc>

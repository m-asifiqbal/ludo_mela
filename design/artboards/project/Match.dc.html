<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ludo Mela — Match</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFE27A}a:hover{color:#FFF3B8}
:root{--e:cubic-bezier(.2,.8,.2,1);--b:cubic-bezier(.34,1.56,.64,1)}
button,a{-webkit-tap-highlight-color:transparent;transition:transform 150ms var(--b),filter 160ms var(--e),box-shadow 160ms var(--e),opacity 160ms var(--e)}
button:focus-visible,a:focus-visible{outline:3px solid #FFFFFF;outline-offset:3px}
button:disabled{cursor:default}
.ttl{font-family:'Lilita One',sans-serif;font-weight:400;color:#FFFFFF;letter-spacing:.4px;text-shadow:0 -1.5px 0 #0A2A6B,1.5px 0 0 #0A2A6B,0 1.5px 0 #0A2A6B,-1.5px 0 0 #0A2A6B,1.2px 1.2px 0 #0A2A6B,-1.2px 1.2px 0 #0A2A6B,1.2px -1.2px 0 #0A2A6B,-1.2px -1.2px 0 #0A2A6B,0 3px 0 #0A2A6B}
.gl{position:relative;border:0;cursor:pointer;font-family:'Lilita One',sans-serif;font-weight:400;color:#FFFFFF;letter-spacing:.4px;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;text-shadow:0 2px 0 rgba(0,0,0,.3);box-sizing:border-box}
.gl::after{content:'';position:absolute;left:8%;right:8%;top:3px;height:42%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.gl:active{transform:translateY(3px) scale(.98)}
.g-green{background:linear-gradient(#8DEB50,#47BA2B 55%,#2E9A1B);box-shadow:inset 0 -3px 0 rgba(0,0,0,.14),0 4px 0 #1D6B0F,0 8px 12px rgba(0,20,60,.35)}
.g-navy{background:linear-gradient(#2A5BB0,#173F86);box-shadow:inset 0 0 0 2px #3F78D6,inset 0 -3px 0 rgba(0,0,0,.2),0 4px 0 #0B2457,0 8px 12px rgba(0,20,60,.35)}
.g-gold{color:#5A2E00;text-shadow:0 1px 0 rgba(255,255,255,.55);background:linear-gradient(#FFEC8F,#FFC61F 55%,#F59E00);box-shadow:inset 0 -3px 0 rgba(0,0,0,.1),0 4px 0 #B26400,0 8px 12px rgba(0,20,60,.35)}
.g-dim{background:linear-gradient(#5E7BB0,#3F5D94);box-shadow:inset 0 -3px 0 rgba(0,0,0,.14),0 4px 0 #233C6B}
.lm-pop{animation:lmPop 460ms var(--b) backwards}
.lm-bob{animation:lmBob 900ms ease-in-out infinite}
.lm-arrow{animation:lmArrow 800ms ease-in-out infinite}
.lm-ring{animation:lmSpin 2.6s linear infinite;transform-origin:50% 50%}
.lm-hopA{animation:lmHopA 175ms var(--e)}
.lm-hopB{animation:lmHopB 175ms var(--e)}
.lm-knock{animation:lmKnock 600ms var(--e)}
.lm-pie{animation:lmPie 15s linear forwards}
.lm-tossA{animation:lmTossA 820ms var(--e)}
.lm-tossB{animation:lmTossB 820ms var(--e)}
.lm-trayIn{animation:lmTrayIn 320ms var(--b) backwards}
.lm-burst{animation:lmBurst 760ms var(--e) forwards}
.lm-think{animation:lmThink 1s ease-in-out infinite}
@keyframes lmPop{from{opacity:0;transform:scale(.4)}}
@keyframes lmBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes lmArrow{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes lmSpin{to{transform:rotate(360deg)}}
@keyframes lmHopA{0%{transform:translateY(0) scale(1,1)}45%{transform:translateY(-13px) scale(.9,1.12)}85%{transform:translateY(0) scale(1.14,.84)}100%{transform:none}}
@keyframes lmHopB{0%{transform:translateY(0) scale(1,1)}45%{transform:translateY(-13px) scale(.9,1.12)}85%{transform:translateY(0) scale(1.14,.84)}100%{transform:none}}
@keyframes lmKnock{0%{transform:scale(1) rotate(0)}30%{transform:scale(1.5) rotate(180deg)}100%{transform:scale(1) rotate(720deg)}}
@keyframes lmPie{0%{stroke-dashoffset:0;stroke:#5BE34A}65%{stroke:#5BE34A}82%{stroke:#FFC61F}100%{stroke-dashoffset:-100;stroke:#FF4A3D}}
@keyframes lmTossA{0%{transform:translateY(0) scale(1)}28%{transform:translateY(-38px) scale(1.2)}60%{transform:translateY(0) scale(1.08,.86)}76%{transform:translateY(-9px) scale(1)}100%{transform:none}}
@keyframes lmTossB{0%{transform:translateY(0) scale(1)}28%{transform:translateY(-38px) scale(1.2)}60%{transform:translateY(0) scale(1.08,.86)}76%{transform:translateY(-9px) scale(1)}100%{transform:none}}
@keyframes lmTrayIn{from{opacity:0;transform:scale(.6)}}
@keyframes lmBurst{0%{opacity:1;transform:scale(.2) rotate(0)}60%{opacity:1;transform:scale(1.15) rotate(20deg)}100%{opacity:0;transform:scale(1.4) rotate(30deg)}}
@keyframes lmThink{0%,100%{opacity:1}50%{opacity:.4}}
@media (prefers-reduced-motion: reduce){*{animation-duration:1ms !important;animation-delay:0ms !important;animation-iteration-count:1 !important;transition-duration:1ms !important}}
.av-blink,.av-earl,.av-earr{transform-box:view-box}.av-blink{animation:avBlink 4.2s infinite}.av-earl{animation:avEarL 5s infinite}.av-earr{animation:avEarR 5s 1.4s infinite}@keyframes avBlink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}@keyframes avEarL{0%,84%,100%{transform:rotate(0)}88%{transform:rotate(-9deg)}93%{transform:rotate(5deg)}}@keyframes avEarR{0%,84%,100%{transform:rotate(0)}88%{transform:rotate(9deg)}93%{transform:rotate(-5deg)}}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#1764D2;font-family:'Baloo 2',system-ui,sans-serif;color:#FFFFFF">
  <div style="position:absolute;inset:0;background:radial-gradient(110% 60% at 50% 48%,#3EA2FF 0%,#1F78E6 40%,#1659C4 72%,#0F45A6 100%)"></div>
  <svg width="390" height="844" aria-hidden="true" style="position:absolute;inset:0"><defs><pattern id="jali" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M22 8l14 14-14 14L8 22zM12.5 12.5h19v19h-19z" fill="none" stroke="#FFFFFF" stroke-opacity=".07" stroke-width="1.6"></path></pattern></defs><rect width="390" height="844" fill="url(#jali)"></rect></svg>

  <div style="position:relative;z-index:1;height:100%;display:flex;flex-direction:column">
    <div style="height:47px;flex:none"></div>
    <div role="complementary" aria-label="Advertisement" style="height:50px;flex:none;margin:0 6px;background:#0B1530;display:flex;align-items:center;justify-content:center;gap:8px">
      <span style="font:800 11px/1 'Baloo 2',sans-serif;color:#3A2200;background:#FFC61F;border-radius:4px;padding:4px 6px 2px">Ad</span>
      <span style="font:700 13px 'Baloo 2',sans-serif;color:#CFE3FF">AdMob banner · fixed above the opponents</span>
    </div>

    <div style="flex:1"></div>
    <div style="flex:none;display:flex;justify-content:space-between;align-items:flex-start;padding:0 12px">
      <sc-for list="{{top}}" as="p" hint-placeholder-count="2">
        <div style="position:relative;display:flex;flex-direction:column;align-items:{{p.align}};gap:5px;width:150px">
          <div style="display:flex;flex-direction:{{p.dir}};align-items:center;gap:8px">
            <span style="position:relative;width:60px;height:60px;flex:none">
              <span style="position:absolute;inset:0;border-radius:12px;overflow:hidden;box-shadow:0 0 0 3px {{p.frame}},0 0 0 4.5px #0A2A6B,0 6px 10px 3px rgba(0,0,0,.3)">
                <svg width="60" height="60" viewBox="0 0 48 48" aria-hidden="true"><sc-for list="{{p.av}}" as="q" hint-placeholder-count="10"><path class="{{q.c}}" style="transform-origin:{{q.o}}" d="{{q.d}}" fill="{{q.f}}" stroke="{{q.s}}" stroke-width="{{q.w}}" stroke-linecap="round" stroke-linejoin="round"></path></sc-for></svg>
                <sc-if value="{{p.active}}" hint-placeholder-val="{{ false }}"><svg width="60" height="60" viewBox="0 0 60 60" aria-hidden="true" style="position:absolute;inset:0;opacity:.72"><circle class="lm-pie" cx="30" cy="30" r="21.5" fill="none" stroke="#5BE34A" stroke-width="43" pathLength="100" stroke-dasharray="100 100" stroke-dashoffset="0" transform="rotate(-90 30 30)"></circle></svg></sc-if>
              </span>
            </span>
            <span style="position:relative;width:60px;height:60px;flex:none">
              <sc-if value="{{p.hasTray}}" hint-placeholder-val="{{ false }}">
                <span class="lm-trayIn" style="position:absolute;inset:0;border-radius:14px;background:linear-gradient(#2C68C4,#1A4594);box-shadow:inset 0 0 0 3px #0C2C6A,inset 0 5px 0 rgba(255,255,255,.18),0 4px 0 #081E4E;display:grid;place-items:center">
                  <span class="{{p.toss}}" style="display:block;width:44px;height:44px;perspective:240px">
                    <span style="position:relative;display:block;width:44px;height:44px;transform-style:preserve-3d;transform:rotateX(-14deg) rotateY(18deg)">
                      <span style="position:absolute;inset:0;transform-style:preserve-3d;transform:{{p.dice.rot}};transition:transform 820ms cubic-bezier(.15,.85,.25,1.08)">
                        <sc-for list="{{p.dice.faces}}" as="f" hint-placeholder-count="6"><span style="position:absolute;inset:0;border-radius:10px;background:radial-gradient(circle at 34% 28%,#FF9B90 0,#EE3B30 42%,#B3160E 100%);box-shadow:inset 0 0 0 1.5px rgba(90,0,0,.25),inset 0 -4px 6px rgba(90,0,0,.35),inset 0 3px 3px rgba(255,255,255,.35);transform:{{f.tf}};display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));grid-template-rows:repeat(3, minmax(0, 1fr));padding:{{f.pad}}px;box-sizing:border-box;backface-visibility:hidden"><sc-for list="{{f.pips}}" as="q" hint-placeholder-count="9"><span style="display:grid;place-items:center"><span style="width:{{q.sz}}px;height:{{q.sz}}px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#FFFFFF,#F1E4E2 70%);box-shadow:inset 0 -1px 1px rgba(120,0,0,.35);opacity:{{q.on}}"></span></span></sc-for></span></sc-for>
                      </span>
                    </span>
                  </span>
                </span>
              </sc-if>
            </span>
          </div>
          <span class="ttl" style="font-size:14px;color:{{p.nameInk}};height:20px;display:flex;align-items:center;gap:3px">
            <sc-if value="{{p.showName}}" hint-placeholder-val="{{ true }}"><span class="{{p.subAnim}}">{{p.label}}</span></sc-if>
            <sc-if value="{{p.hasMini}}" hint-placeholder-val="{{ false }}"><sc-for list="{{p.mini}}" as="m" hint-placeholder-count="2"><span class="lm-pop" style="width:18px;height:18px;border-radius:4px;background:#FFFFFF;box-shadow:0 2px 0 #9FB4D6;display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));grid-template-rows:repeat(3, minmax(0, 1fr));padding:2.5px;box-sizing:border-box"><sc-for list="{{m.pips}}" as="q" hint-placeholder-count="9"><span style="display:grid;place-items:center"><span style="width:3.4px;height:3.4px;border-radius:2px;background:#1B2030;opacity:{{q}}"></span></span></sc-for></span></sc-for></sc-if>
          </span>
          <sc-if value="{{p.hasBubble}}" hint-placeholder-val="{{ false }}"><span class="lm-pop" style="position:absolute;{{p.bubSide}}:68px;top:48px;z-index:30;min-height:34px;border-radius:12px;background:#FFFFFF;box-shadow:0 4px 0 #9FB4D6,0 8px 14px rgba(0,0,0,.35);display:flex;align-items:center;padding:2px 10px;white-space:nowrap;color:#0A2A6B;font:400 14px 'Lilita One',sans-serif"><sc-if value="{{p.bubIsSticker}}" hint-placeholder-val="{{ false }}"><svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><sc-for list="{{p.bubParts}}" as="q" hint-placeholder-count="5"><path d="{{q.d}}" fill="{{q.f}}" stroke="{{q.s}}" stroke-width="{{q.w}}" stroke-linecap="round" stroke-linejoin="round"></path></sc-for></svg></sc-if>{{p.bubText}}</span></sc-if>
        </div>
      </sc-for>
    </div>

    <span class="ttl" style="flex:none;text-align:center;font-size:20px;color:#FFD84A;margin:2px 0 4px">Classic</span>

    <div style="flex:none;align-self:center;position:relative;width:385px;height:385px">
      <div style="position:absolute;inset:0;border-radius:16px;background:linear-gradient(#EBB984,#BE7F44);box-shadow:inset 0 0 0 1.5px #6E3F14,inset 0 2px 0 rgba(255,255,255,.5),0 4px 0 #5E3410,0 12px 20px rgba(0,20,60,.45)"></div>
      <div role="img" aria-label="{{boardLabel}}" style="position:absolute;left:5px;top:5px;width:375px;height:375px;border-radius:11px;overflow:hidden;background:#D2D2D2;box-shadow:0 0 0 1.5px #6E3F14">
        <sc-for list="{{yards}}" as="y" hint-placeholder-count="4">
          <div style="position:absolute;left:{{y.x}}px;top:{{y.y}}px;width:150px;height:150px;background:{{y.main}}">
            <div style="position:absolute;left:16px;top:16px;width:118px;height:118px;border-radius:18px;background:{{y.dark}};box-shadow:inset 0 3px 5px rgba(0,0,0,.18),0 1px 0 rgba(255,255,255,.25)"></div>
          </div>
        </sc-for>
        <sc-for list="{{tiles}}" as="c" hint-placeholder-count="72">
          <div style="position:absolute;left:{{c.x}}px;top:{{c.y}}px;width:24px;height:24px;background:{{c.bg}};display:grid;place-items:center">
            <sc-if value="{{c.has}}" hint-placeholder-val="{{ false }}"><svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true" style="transform:rotate({{c.rot}}deg)"><path d="{{c.icon}}" fill="{{c.fill}}"></path></svg></sc-if>
          </div>
        </sc-for>
        <div style="position:absolute;left:150px;top:150px;width:75px;height:75px">
          <div style="position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 50%);background:#F8C21C"></div>
          <div style="position:absolute;inset:0;clip-path:polygon(100% 0,100% 100%,50% 50%);background:#1E8BEA"></div>
          <div style="position:absolute;inset:0;clip-path:polygon(0 100%,100% 100%,50% 50%);background:#E8322B"></div>
          <div style="position:absolute;inset:0;clip-path:polygon(0 0,0 100%,50% 50%);background:#76BE2E"></div>
        </div>
      </div>
      <div style="position:absolute;left:5px;top:5px;width:375px;height:375px">
        <sc-for list="{{ghosts}}" as="g" hint-placeholder-count="0">
          <span class="lm-pop" style="position:absolute;left:{{g.x}}px;top:{{g.y}}px;width:22px;height:22px;border-radius:50%;border:2.5px dashed #0C2C6A;background:rgba(255,198,31,.55);box-sizing:border-box;pointer-events:none"></span>
          <sc-if value="{{g.hasTag}}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:{{g.tx}}px;top:{{g.ty}}px;transform:translateX(-50%);z-index:14;pointer-events:none"><span class="lm-pop ttl" style="display:block;height:19px;border-radius:10px;background:{{g.bg}};font-size:10.5px;line-height:20px;padding:0 7px;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.3)">{{g.tag}}</span></span></sc-if>
        </sc-for>
        <sc-for list="{{tokens}}" as="t" hint-placeholder-count="16">
          <button type="button" aria-label="{{t.label}}" onClick="{{t.tap}}" style="position:absolute;left:{{t.hx}}px;top:{{t.hy}}px;width:44px;height:44px;padding:0;border:0;background:transparent;cursor:pointer;pointer-events:{{t.pe}};z-index:{{t.z}};transition:{{t.tr}}">
            <sc-if value="{{t.sel}}" hint-placeholder-val="{{ false }}"><svg class="lm-ring" width="{{t.rs}}" height="{{t.rs}}" viewBox="0 0 40 40" aria-hidden="true" style="position:absolute;left:{{t.rx}}px;top:{{t.ry}}px"><circle cx="20" cy="20" r="17.5" fill="rgba(255,255,255,.22)" stroke="#FFFFFF" stroke-width="2.8" stroke-dasharray="6 4.4"></circle></svg></sc-if>
            <sc-if value="{{t.best}}" hint-placeholder-val="{{ false }}"><span class="lm-pop" style="position:absolute;left:{{t.bx}}px;top:{{t.by}}px;width:{{t.bs}}px;height:{{t.bs}}px;border-radius:50%;box-shadow:0 0 0 3px #7DF0E4,0 0 14px 5px rgba(125,240,228,.85)"></span></sc-if>
            <span class="{{t.anim}}" style="position:absolute;left:{{t.ox}}px;top:{{t.oy}}px;width:{{t.s}}px;height:{{t.s}}px;display:block">
              <span style="position:absolute;inset:0;border-radius:50%;background:{{t.side}};transform:translateY({{t.th}}px);box-shadow:0 {{t.th}}px 4px rgba(0,0,0,.4)"></span>
              <span style="position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 32%,{{t.light}} 0%,{{t.main}} 58%,{{t.dark}} 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.75),inset 0 0 0 3.5px {{t.dark}},inset 0 3px 2px rgba(255,255,255,.35)"></span>
              <svg width="{{t.es}}" height="{{t.es}}" viewBox="0 0 24 24" aria-hidden="true" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)"><path d="{{t.emblem}}" fill="#FFFFFF" fill-opacity=".92"></path></svg>
            </span>
          </button>
        </sc-for>
        <sc-if value="{{hasBurst}}" hint-placeholder-val="{{ false }}"><svg class="lm-burst" width="90" height="90" viewBox="0 0 90 90" aria-hidden="true" style="position:absolute;left:{{burst.x}}px;top:{{burst.y}}px;z-index:20;pointer-events:none"><path d="M45 4l7 22 21-10-10 21 22 8-22 8 10 21-21-10-7 22-7-22-21 10 10-21-22-8 22-8-10-21 21 10z" fill="{{burst.c}}" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"></path><text x="45" y="52" text-anchor="middle" font-family="Lilita One" font-size="17" fill="#FFFFFF" stroke="#0A2A6B" stroke-width="3" paint-order="stroke">{{burst.t}}</text></svg></sc-if>
      </div>
      <div aria-live="polite" style="position:absolute;left:0;right:0;top:170px;display:flex;justify-content:center;pointer-events:none;z-index:30">
        <sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}"><span class="lm-pop ttl" style="height:44px;border-radius:22px;background:linear-gradient(#2064CC,#1549A6);box-shadow:inset 0 0 0 3px #FFC61F,0 5px 0 #0A2E70,0 12px 24px rgba(0,0,0,.45);font-size:19px;line-height:44px;padding:0 20px;white-space:nowrap">{{toast}}</span></sc-if>
      </div>
    </div>

    <div style="height:10px;flex:none"></div>
    <div style="flex:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 12px">
      <sc-for list="{{bottom}}" as="p" hint-placeholder-count="2">
        <div style="position:relative;display:flex;flex-direction:column;align-items:{{p.align}};gap:5px;width:150px">
          <span class="ttl" style="font-size:14px;color:{{p.nameInk}};height:20px;display:flex;align-items:center;gap:3px">
            <sc-if value="{{p.showName}}" hint-placeholder-val="{{ true }}"><span class="{{p.subAnim}}">{{p.label}}</span></sc-if>
            <sc-if value="{{p.hasMini}}" hint-placeholder-val="{{ false }}"><sc-for list="{{p.mini}}" as="m" hint-placeholder-count="2"><span class="lm-pop" style="width:18px;height:18px;border-radius:4px;background:#FFFFFF;box-shadow:0 2px 0 #9FB4D6;display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));grid-template-rows:repeat(3, minmax(0, 1fr));padding:2.5px;box-sizing:border-box"><sc-for list="{{m.pips}}" as="q" hint-placeholder-count="9"><span style="display:grid;place-items:center"><span style="width:3.4px;height:3.4px;border-radius:2px;background:#1B2030;opacity:{{q}}"></span></span></sc-for></span></sc-for></sc-if>
          </span>
          <div style="display:flex;flex-direction:{{p.dir}};align-items:center;gap:8px">
            <span style="position:relative;width:60px;height:60px;flex:none">
              <span style="position:absolute;inset:0;border-radius:12px;overflow:hidden;box-shadow:0 0 0 3px {{p.frame}},0 0 0 4.5px #0A2A6B,0 6px 10px 3px rgba(0,0,0,.3)">
                <svg width="60" height="60" viewBox="0 0 48 48" aria-hidden="true"><sc-for list="{{p.av}}" as="q" hint-placeholder-count="10"><path class="{{q.c}}" style="transform-origin:{{q.o}}" d="{{q.d}}" fill="{{q.f}}" stroke="{{q.s}}" stroke-width="{{q.w}}" stroke-linecap="round" stroke-linejoin="round"></path></sc-for></svg>
                <sc-if value="{{p.active}}" hint-placeholder-val="{{ false }}"><svg width="60" height="60" viewBox="0 0 60 60" aria-hidden="true" style="position:absolute;inset:0;opacity:.72"><circle class="lm-pie" cx="30" cy="30" r="21.5" fill="none" stroke="#5BE34A" stroke-width="43" pathLength="100" stroke-dasharray="100 100" stroke-dashoffset="0" transform="rotate(-90 30 30)"></circle></svg></sc-if>
              </span>
            </span>
            <span style="position:relative;width:60px;height:60px;flex:none">
              <sc-if value="{{p.hasTray}}" hint-placeholder-val="{{ false }}">
                <button type="button" aria-label="{{p.diceLabel}}" disabled="{{p.notMine}}" onClick="{{p.roll}}" class="lm-trayIn" style="position:absolute;inset:0;border:0;padding:0;cursor:pointer;border-radius:14px;background:linear-gradient(#2C68C4,#1A4594);box-shadow:inset 0 0 0 3px #0C2C6A,inset 0 5px 0 rgba(255,255,255,.18),0 4px 0 #081E4E;display:grid;place-items:center">
                  <span class="{{p.toss}}" style="display:block;width:44px;height:44px;perspective:240px">

      return;
    }
    const distinct = opts.filter((m, j) => opts.findIndex((o) => o.to === m.to && st.pos.red[o.i] === st.pos.red[m.i]) === j);
    if (distinct.length === 1) {
      this.setState({ sixes, phase: 'auto', opts: [], rolls });
      this.later(420, () => this.move('red', opts[0]));
      return;
    }
    this.setState({ sixes, phase: 'pick', opts, rolls });
  }
  tapToken(i) {
    const st = this.state;
    if (st.phase !== 'pick') return;
    const m = st.opts.find((o) => o.i === i);
    if (m) this.move('red', m);
  }
  move(k, m) {
    const from = this.state.pos[k][m.i];
    const path = from < 0 ? [0] : Array.from({ length: m.to - from }, (_, j) => from + j + 1);
    this.setState({ phase: 'moving', opts: [], moving: k + m.i, hint: -1 });
    path.forEach((s, j) => this.later(180 * j, () => {
      const pos = this.state.pos;
      this.setState({ hop: this.state.hop + 1, pos: Object.assign({}, pos, { [k]: pos[k].map((q, x) => (x === m.i ? s : q)) }) });
    }));
    this.later(180 * path.length + 90, () => this.land(k, m));
  }
  land(k, m) {
    const st = this.state;
    const pos = Object.assign({}, st.pos);
    let victim = '';
    if (m.to <= 50 && !SAFE.includes(gidx(k, m.to))) {
      const g = gidx(k, m.to);
      ORDER.forEach((o) => {
        if (o === k) return;
        pos[o] = pos[o].map((q, x) => { if (q >= 0 && q <= 50 && gidx(o, q) === g) { victim = o + x; return -1; } return q; });
      });
    }
    const home = m.to === 56;
    const again = st.die === 6 || !!victim || home;
    this.setState({ pos, moving: '', knocked: victim, phase: 'wait' });
    if (victim) {
      const vk = victim.slice(0, -1);
      this.pop(k, m.to, 'POW!', '#F2463B');
      if (k === 'red') { this.say('Captured ' + NAMES[vk] + '! Roll again'); this.speak(vk, '', 'angry'); }
      else { this.say(NAMES[k] + ' captured ' + (vk === 'red' ? 'you' : NAMES[vk])); this.speak(k, '', 'cool'); }
      this.later(700, () => this.setState({ knocked: '' }));
    } else if (home) { this.pop(k, 56, 'HOME!', '#47BA2B'); this.say(k === 'red' ? 'Home! Roll again' : NAMES[k] + ' got one home'); }
    else if (st.die === 6 && k === 'red') this.say('Six! Roll again');
    if (pos[k].every((q) => q === 56)) { this.setState({ phase: 'over' }); this.say(k === 'red' ? 'You win!' : NAMES[k] + ' wins'); return; }
    this.later(victim ? 950 : 440, () => (again ? this.startTurn(k, true) : this.nextTurn()));
  }
  nextTurn() { this.startTurn(ORDER[(ORDER.indexOf(this.state.turn) + 1) % 4], false); }
  startTurn(k, again) {
    this.setState({ turn: k, phase: 'roll', sixes: again ? this.state.sixes : 0, opts: [], rolls: again ? this.state.rolls : [] });
    if (k !== 'red') this.later(again ? 560 : 820, () => this.roll(true));
  }
  useHint() {
    const st = this.state;
    if (st.phase !== 'pick' || st.hints < 1 || st.hint >= 0) return;
    const best = pick('red', st.opts, st.pos, { run: 1, safe: 1.2, hunt: 1.2, noise: 0 });
    this.setState({ hint: best.i, hints: st.hints - 1 });
  }
  renderVals() {
    const st = this.state;
    const optI = st.opts.map((o) => o.i);

    const tiles = [];
    TRACK.forEach((rc, g) => {
      const own = STARTS[g];
      const entry = ORDER.find((k) => SEATS[k].entry === g);
      const t = { x: rc[1] * C + 0.5, y: rc[0] * C + 0.5, bg: '#FFFFFF', has: false, icon: '', fill: 'none', rot: 0 };
      if (own) Object.assign(t, { bg: PAL[own].main, has: true, icon: STAR, fill: PAL[own].dark });
      else if (SAFE.includes(g)) Object.assign(t, { bg: '#CFCFCF', has: true, icon: STAR, fill: '#A0A0A0' });
      if (entry) Object.assign(t, { has: true, icon: ARROW, fill: PAL[entry].main, rot: SEATS[entry].rot });
      tiles.push(t);
    });
    ORDER.forEach((k) => SEATS[k].lane.forEach((rc) => tiles.push({ x: rc[1] * C + 0.5, y: rc[0] * C + 0.5, bg: PAL[k].main, has: false, icon: '', fill: 'none', rot: 0 })));
    const yards = ORDER.map((k) => ({ x: SEATS[k].yard[1] * C, y: SEATS[k].yard[0] * C, main: PAL[k].main, dark: PAL[k].dark }));

    const raw = [];
    ORDER.forEach((k) => st.pos[k].forEach((s, i) => raw.push({ k, s, i, rc: cellOf(k, s, i) })));
    const stacks = {};
    raw.forEach((t) => { if (t.s >= 0 && t.s <= 55) { const key = t.rc.join(','); (stacks[key] = stacks[key] || []).push(t); } });
    const tokens = raw.map((t) => {
      const grp = t.s >= 0 && t.s <= 55 ? stacks[t.rc.join(',')] : [t];
      const j = grp.indexOf(t);
      const n = grp.length;
      const dx = n > 1 ? (j - (n - 1) / 2) * 8 : 0;
      const size = t.s === 56 ? 15 : t.s < 0 ? 29 : n > 1 ? 19 : 22;
      const cx = (t.rc[1] + 0.5) * C + dx;
      const cy = (t.rc[0] + 0.5) * C;
      const id = t.k + t.i;
      const sel = st.phase === 'pick' && t.k === 'red' && optI.includes(t.i);
      const moving = st.moving === id;
      const knocked = st.knocked === id;
      const where = t.s < 0 ? 'in the yard' : t.s === 56 ? 'home' : t.s > 50 ? 'in the home lane' : 'on the track';
      const ms = knocked ? 600 : 165;
      const ease = 'cubic-bezier(.2,.8,.2,1)';
      const rs = size + 14;
      return Object.assign({
        hx: cx - 22, hy: cy - 22, z: moving ? 12 : sel ? 9 : 5 + Math.round(t.rc[0]),
        ox: 22 - size / 2, oy: 21 - size / 2, s: size, th: size > 20 ? 3.5 : 2.5, es: Math.round(size * 0.6),
        rx: 22 - rs / 2, ry: 21 - rs / 2 + 1.5, rs, bx: 22 - (size + 6) / 2, by: 21 - (size + 6) / 2, bs: size + 6,
        anim: knocked ? 'lm-knock' : moving ? (st.hop % 2 ? 'lm-hopA' : 'lm-hopB') : sel ? 'lm-bob' : '',
        tr: 'left ' + ms + 'ms ' + ease + ', top ' + ms + 'ms ' + ease,
        sel, best: sel && st.hint === t.i, pe: sel ? 'auto' : 'none', emblem: LOTUS,
        label: (t.k === 'red' ? 'Your' : NAMES[t.k] + '’s') + ' puck ' + (t.i + 1) + ', ' + where + (sel ? '. Tap to move' : ''),
        tap: () => this.tapToken(t.i)
      }, PAL[t.k]);
    });

    const ghosts = [];
    if (st.phase === 'pick') {
      const seen = {};
      st.opts.forEach((m) => {
        const rc = cellOf('red', m.to, m.i);
        const key = rc.join(',');
        if (seen[key]) return;
        seen[key] = 1;
        const next = Object.assign({}, st.pos, { red: st.pos.red.map((q, x) => (x === m.i ? m.to : q)) });
        let tag = ''; let bg = '';
        if (victimAt('red', m.to, st.pos)) { tag = 'CAPTURE'; bg = '#F2463B'; }
        else if (m.to === 56) { tag = 'HOME'; bg = '#47BA2B'; }
        else if (m.to > 50 || SAFE.includes(gidx('red', m.to))) { tag = 'SAFE'; bg = '#2F95F2'; }
        else if (threat('red', m.to, next) > 0) { tag = 'RISKY'; bg = '#F59E00'; }
        const cx = (rc[1] + 0.5) * C;
        const cy = (rc[0] + 0.5) * C;
        ghosts.push({ x: cx - 11, y: cy - 11, tx: Math.min(345, Math.max(30, cx)), ty: cy < 40 ? cy + 13 : cy - 33, hasTag: !!tag, tag, bg });
      });
    }

    const corner = (k, kind, right, pers) => {
      const active = st.turn === k;
      const b = st.bubble && st.bubble.k === k ? st.bubble : null;
      const trayPhase = active && (st.phase === 'roll' || st.phase === 'rolling');
      const hasMini = active && st.rolls.length > 0 && !trayPhase;
      const botSub = st.phase === 'think' ? 'Thinking…' : NAMES[k];
      return {
        av: avatar(kind), active, dir: right ? 'row-reverse' : 'row', align: right ? 'flex-end' : 'flex-start',
        frame: active ? '#FFC61F' : '#2B78D6',
        label: active && k !== 'red' ? botSub : NAMES[k] + (pers ? ' · ' + pers : ''),
        nameInk: active ? '#FFFFFF' : '#C7D8F2', subAnim: active && st.phase === 'think' ? 'lm-think' : '',
        showName: !hasMini, hasMini,
        mini: st.rolls.map((v) => ({ pips: Array.from({ length: 9 }, (_, x) => (PIPS[v].includes(x) ? 1 : 0)) })),
        hasTray: trayPhase, toss: st.toss % 2 ? 'lm-tossA' : 'lm-tossB',
        dice: dice(44, st.die, st.spins),
        notch: right ? 'right' : 'left', notchBorder: right ? 'border-left' : 'border-right',
        arrow: active && k === 'red' && st.phase === 'roll',
        notMine: k !== 'red', diceLabel: k === 'red' ? 'Roll the dice' : NAMES[k] + '’s dice',
        roll: () => this.roll(false),
        hasBubble: !!b, bubIsSticker: !!(b && b.sticker), bubParts: b && b.sticker ? sticker(b.sticker) : [], bubText: b ? b.text : '',
        bubSide: right ? 'right' : 'left'
      };
    };
    const SK = ['happy', 'laugh', 'wow', 'cool', 'angry', 'cry'];
    const statusYou = { roll: 'Tap the dice to roll', rolling: '', pick: 'Tap a puck with a ring', moving: '', auto: '', think: '', wait: '', over: 'Game over' };
    return {
      tiles, yards, tokens, ghosts,
      top: [corner('green', 'raja', false, 'Hunter'), corner('yellow', 'mitu', true, 'Turtle')],
      bottom: [corner('red', 'you', false, ''), corner('blue', 'tara', true, 'Racer')],
      hasToast: !!st.toast, toast: st.toast,
      hasBurst: !!st.burst, burst: st.burst || { x: 0, y: 0, t: '', c: '#FFFFFF' },
      pickerShown: st.picker, pickerOpen: st.picker ? 'true' : 'false',
      togglePicker: () => this.setState({ picker: !this.state.picker }),
      stickers: SK.map((s) => ({ parts: sticker(s), label: s + ' sticker', send: () => this.speak('red', '', s) })),
      phrases: ['Well played!', 'Oops!', 'Hurry up!', 'Good luck!'].map((t) => ({ text: t, send: () => this.speak('red', t) })),
      boardLabel: 'Ludo board. ' + (st.turn === 'red' ? 'Your turn. ' : NAMES[st.turn] + '’s turn. ') + 'Last roll ' + st.die + '.',
      hints: st.hints,
      hintOff: !(st.phase === 'pick' && st.hints > 0 && st.hint < 0),
      hintCls: st.phase === 'pick' && st.hints > 0 && st.hint < 0 ? 'g-green' : 'g-dim',
      useHint: () => this.useHint(),
      statusLine: st.turn === 'red' ? (statusYou[st.phase] || '') : NAMES[st.turn] + ' is playing…',
      over: st.phase === 'over'
    };
  }
}
</script>

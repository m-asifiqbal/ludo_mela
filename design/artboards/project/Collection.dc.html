<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ludo Mela — Collection</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
:root{--e:cubic-bezier(.2,.8,.2,1);--b:cubic-bezier(.34,1.56,.64,1)}
button,a{-webkit-tap-highlight-color:transparent;transition:transform 150ms var(--b),filter 160ms var(--e),background 160ms var(--e),box-shadow 160ms var(--e)}
button:focus-visible,a:focus-visible{outline:3px solid #FFFFFF;outline-offset:3px}
.ttl{font-family:'Lilita One',sans-serif;font-weight:400;color:#FFFFFF;letter-spacing:.4px;text-shadow:0 -1.5px 0 #0A2A6B,1.5px 0 0 #0A2A6B,0 1.5px 0 #0A2A6B,-1.5px 0 0 #0A2A6B,1.2px 1.2px 0 #0A2A6B,-1.2px 1.2px 0 #0A2A6B,1.2px -1.2px 0 #0A2A6B,-1.2px -1.2px 0 #0A2A6B,0 3px 0 #0A2A6B}
.gl{position:relative;border:0;cursor:pointer;font-family:'Lilita One',sans-serif;font-weight:400;color:#FFFFFF;letter-spacing:.4px;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:5px;text-shadow:0 2px 0 rgba(0,0,0,.3);box-sizing:border-box}
.gl::after{content:'';position:absolute;left:6%;right:6%;top:3px;height:40%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.gl:active{transform:translateY(3px) scale(.98)}
.g-green{background:linear-gradient(#8DEB50,#47BA2B 55%,#2E9A1B);box-shadow:inset 0 -3px 0 rgba(0,0,0,.14),0 3px 0 #1D6B0F}
.g-blue{background:linear-gradient(#6DCEFF,#2F95F2 55%,#1C72DA);box-shadow:inset 0 -3px 0 rgba(0,0,0,.14),0 3px 0 #0D4A9E}
.g-gold{color:#5A2E00;text-shadow:0 1px 0 rgba(255,255,255,.55);background:linear-gradient(#FFEC8F,#FFC61F 55%,#F59E00);box-shadow:inset 0 -3px 0 rgba(0,0,0,.1),0 3px 0 #B26400}
.g-grey{background:linear-gradient(#9DAAC0,#6E7C96);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12),0 3px 0 #3E4A60;cursor:default}
.g-navy{background:linear-gradient(#21457F,#132D5E);box-shadow:inset 0 0 0 2px #2F5FA8,0 3px 0 #091A3C}
.badge{position:absolute;min-width:22px;height:22px;border-radius:11px;font:400 12px/22px 'Lilita One',sans-serif;color:#FFFFFF;text-align:center;padding:0 5px;box-sizing:border-box;box-shadow:0 0 0 2px #FFFFFF,0 2px 0 2px rgba(0,0,0,.25)}
.scroll{scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.lm-rise{animation:lmRise 380ms var(--e) backwards}
.lm-pop{animation:lmPop 360ms var(--b) backwards}
.lm-float{animation:lmFloat 2.8s ease-in-out infinite}
@keyframes lmRise{from{opacity:0;transform:translateY(14px)}}
@keyframes lmPop{from{opacity:0;transform:scale(.7)}}
@keyframes lmFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion: reduce){*{animation-duration:1ms !important;animation-iteration-count:1 !important;transition-duration:1ms !important}}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#1764D2;font-family:'Baloo 2',system-ui,sans-serif;color:#FFFFFF">
  <svg width="0" height="0" aria-hidden="true" style="position:absolute"><defs>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFEC8F"></stop><stop offset=".55" stop-color="#FFC21F"></stop><stop offset="1" stop-color="#E08A00"></stop></linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8A7A"></stop><stop offset=".55" stop-color="#E8322B"></stop><stop offset="1" stop-color="#A8150F"></stop></linearGradient>
    <linearGradient id="gWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0A85A"></stop><stop offset=".6" stop-color="#C06A22"></stop><stop offset="1" stop-color="#7A3E0E"></stop></linearGradient>
    <linearGradient id="gSteel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9FD0FF"></stop><stop offset=".6" stop-color="#3D86E0"></stop><stop offset="1" stop-color="#1C4FA0"></stop></linearGradient>
    <linearGradient id="gGreenL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A6F070"></stop><stop offset="1" stop-color="#2E9A1B"></stop></linearGradient>
    <linearGradient id="gHouse" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB25A"></stop><stop offset="1" stop-color="#E06A12"></stop></linearGradient>
  </defs></svg>
  <div style="position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 40%,#3EA2FF 0%,#1F78E6 40%,#1659C4 72%,#0F45A6 100%)"></div>
  <svg width="390" height="844" aria-hidden="true" style="position:absolute;inset:0"><defs><pattern id="jali" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M22 8l14 14-14 14L8 22zM12.5 12.5h19v19h-19z" fill="none" stroke="#FFFFFF" stroke-opacity=".07" stroke-width="1.6"></path></pattern></defs><rect width="390" height="844" fill="url(#jali)"></rect></svg>

  <div style="position:relative;z-index:1;height:100%;display:flex;flex-direction:column">
    <div style="flex:none;position:relative;padding-top:47px;background:linear-gradient(#123A8A,#0A2464);box-shadow:inset 0 -2px 0 rgba(143,182,255,.4),0 4px 10px rgba(0,20,60,.3)">
      <div aria-hidden="true" style="position:absolute;left:0;right:0;top:0;height:40px;background:repeating-linear-gradient(90deg,#E8322B 0 26px,#FFF1D0 26px 52px)"></div><svg aria-hidden="true" width="390" height="12" viewBox="0 0 390 12" style="position:absolute;left:0;top:39px"><path d="M0 0h26a13 11 0 0 1-26 0z" fill="#E8322B"></path><path d="M26 0h26a13 11 0 0 1-26 0z" fill="#FFF1D0"></path><path d="M52 0h26a13 11 0 0 1-26 0z" fill="#E8322B"></path><path d="M78 0h26a13 11 0 0 1-26 0z" fill="#FFF1D0"></path><path d="M104 0h26a13 11 0 0 1-26 0z" fill="#E8322B"></path><path d="M130 0h26a13 11 0 0 1-26 0z" fill="#FFF1D0"></path><path d="M156 0h26a13 11 0 0 1-26 0z" fill="#E8322B"></path><path d="M182 0h26a13 11 0 0 1-26 0z" fill="#FFF1D0"></path><path d="M208 0h26a13 11 0 0 1-26 0z" fill="#E8322B"></path><path d="M234 0h26a13 11 0 0 1-26 0z" fill="#FFF1D0"></path><path d="M260 0h26a13 11 0 0 1-26 0z" fill="#E8322B"></path><path d="M286 0h26a13 11 0 0 1-26 0z" fill="#FFF1D0"></path><path d="M312 0h26a13 11 0 0 1-26 0z" fill="#E8322B"></path><path d="M338 0h26a13 11 0 0 1-26 0z" fill="#FFF1D0"></path><path d="M364 0h26a13 11 0 0 1-26 0z" fill="#E8322B"></path></svg>
      <div style="position:relative;height:56px;display:flex;align-items:center;gap:8px;padding:0 10px;margin-top:4px">
        <h1 class="ttl" style="margin:0;font-size:26px;flex:1">Collection</h1>
        <button type="button" onClick="{{toggleInfo}}" aria-label="How the collection works" aria-expanded="{{infoOpen}}" class="gl g-navy" style="width:36px;height:36px;border-radius:18px;font-size:20px"><span style="position:relative;z-index:1">i</span></button>
        <span style="height:30px;border-radius:15px;background:#14336E;box-shadow:inset 0 2px 4px rgba(0,0,0,.4);display:flex;align-items:center;gap:4px;padding:0 10px 0 4px"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h12l4.5 6L12 21.5 1.5 9.5z" fill="#C2186D"></path><path d="M6 3.5h12l4.5 6H1.5z" fill="#FF6CC0"></path><path d="M12 21.5L1.5 9.5h21z" fill="#F0328F"></path></svg><span class="ttl" style="font-size:14px">86</span></span>
        <span style="height:30px;border-radius:15px;background:#14336E;box-shadow:inset 0 2px 4px rgba(0,0,0,.4);display:flex;align-items:center;gap:4px;padding:0 10px 0 4px"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.4" r="10" fill="#B86E00"></circle><circle cx="12" cy="11.6" r="10" fill="url(#gGold)"></circle><circle cx="12" cy="11.6" r="7" fill="#FFAE00" stroke="#FFE680" stroke-width="1.3"></circle></svg><span class="ttl" style="font-size:14px">12,450</span></span>
      </div>
    </div>

    <div role="tablist" aria-label="Collection type" style="flex:none;display:flex;gap:8px;padding:12px 12px 8px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
        <button type="button" role="tab" aria-selected="{{t.on}}" onClick="{{t.tap}}" class="{{t.cls}}" style="flex:1;height:46px;border-radius:12px;font-size:18px">
          <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true" style="position:relative;z-index:1"><sc-for list="{{t.icon}}" as="q" hint-placeholder-count="4"><path d="{{q.d}}" fill="{{q.f}}" stroke="{{q.s}}" stroke-width="{{q.w}}" stroke-linejoin="round"></path></sc-for></svg>
          <span style="position:relative;z-index:1">{{t.label}}</span>
          <sc-if value="{{t.hasNew}}" hint-placeholder-val="{{ false }}"><span class="badge" style="right:-6px;top:-8px;background:#47BA2B">{{t.newN}}</span></sc-if>
        </button>
      </sc-for>
    </div>

    <div style="flex:none;display:flex;gap:6px;padding:0 12px 8px">
      <sc-for list="{{legend}}" as="l" hint-placeholder-count="4"><span style="height:20px;border-radius:10px;background:{{l.bg}};font:400 11px/20px 'Lilita One',sans-serif;padding:0 8px;color:#FFFFFF;text-shadow:0 1px 0 rgba(0,0,0,.35);box-shadow:inset 0 0 0 1.5px {{l.rim}}">{{l.label}}</span></sc-for>
    </div>

    <div class="scroll" style="flex:1;min-height:0;overflow-y:auto;padding:4px 12px 16px">
      <div role="tabpanel" style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px">
        <sc-for list="{{items}}" as="it" hint-placeholder-count="6">
          <div class="lm-rise" style="position:relative;border-radius:14px;background:{{it.bg}};box-shadow:inset 0 0 0 2.5px {{it.rim}},inset 0 4px 0 rgba(255,255,255,.25),0 4px 0 {{it.edge}},0 8px 12px rgba(0,20,60,.3);padding:8px 8px 10px;display:flex;flex-direction:column;align-items:center;animation-delay:{{it.d}}">
            <span class="ttl" style="font-size:14.5px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis">{{it.name}}</span>
            <span style="font:400 10.5px 'Lilita One',sans-serif;color:rgba(255,255,255,.85);letter-spacing:.6px;text-transform:uppercase">{{it.rarity}}</span>
            <a href="TryOn.dc.html" aria-label="{{it.tryLabel}}" style="position:relative;width:132px;height:96px;margin:4px 0 2px;border-radius:12px;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.35),rgba(255,255,255,0) 70%);display:block">
              <sc-if value="{{it.isDice}}" hint-placeholder-val="{{ true }}">
                <svg class="lm-float" width="86" height="86" viewBox="0 0 64 64" aria-hidden="true" style="position:absolute;left:23px;top:4px;animation-delay:{{it.d}}"><path d="M32 6l24 12-24 12L8 18z" fill="{{it.top}}" stroke="{{it.edgeInk}}" stroke-width="1.6" stroke-linejoin="round"></path><path d="M8 18l24 12v28L8 46z" fill="{{it.left}}" stroke="{{it.edgeInk}}" stroke-width="1.6" stroke-linejoin="round"></path><path d="M56 18L32 30v28l24-12z" fill="{{it.right}}" stroke="{{it.edgeInk}}" stroke-width="1.6" stroke-linejoin="round"></path><path d="M14 18l18-9" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="2.4" stroke-linecap="round"></path><ellipse cx="32" cy="18" rx="4.2" ry="2.4" fill="{{it.pipTop}}"></ellipse><circle cx="14" cy="29" r="2.5" fill="{{it.pip}}"></circle><circle cx="26" cy="47" r="2.5" fill="{{it.pip}}"></circle><circle cx="20" cy="38" r="2.5" fill="{{it.pip}}"></circle><circle cx="40" cy="34" r="2.5" fill="{{it.pip}}"></circle><circle cx="50" cy="29" r="2.5" fill="{{it.pip}}"></circle><circle cx="40" cy="47" r="2.5" fill="{{it.pip}}"></circle><circle cx="50" cy="42" r="2.5" fill="{{it.pip}}"></circle></svg>
              </sc-if>
              <sc-if value="{{it.isPuck}}" hint-placeholder-val="{{ false }}">
                <sc-for list="{{it.set}}" as="p" hint-placeholder-count="4"><span style="position:absolute;left:{{p.x}}px;top:{{p.y}}px;width:36px;height:36px;display:block"><span style="position:absolute;inset:0;border-radius:{{it.shape}};background:{{p.side}};transform:translateY(5px)"></span><span style="position:absolute;inset:0;border-radius:{{it.shape}};background:radial-gradient(circle at 50% 30%,{{p.light}},{{p.main}} 58%,{{p.dark}});box-shadow:inset 0 0 0 3px {{it.ring}},inset 0 0 0 5px {{p.dark}}"></span><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="position:absolute;left:8px;top:8px"><path d="{{it.emblem}}" fill="#FFFFFF"></path></svg></span></sc-for>
              </sc-if>
              <sc-if value="{{it.isBoard}}" hint-placeholder-val="{{ false }}">
                <span style="position:absolute;left:24px;top:6px;width:84px;height:84px;border-radius:8px;background:{{it.frame}};box-shadow:0 5px 0 {{it.frameEdge}},0 9px 12px rgba(0,0,0,.3);transform:rotate(-5deg);display:block">
                  <span style="position:absolute;left:4px;top:4px;width:76px;height:76px;border-radius:5px;overflow:hidden;background:{{it.cell}};display:block">
                    <sc-for list="{{it.yards}}" as="y" hint-placeholder-count="4"><span style="position:absolute;left:{{y.x}}px;top:{{y.y}}px;width:30px;height:30px;background:{{y.c}}"><span style="position:absolute;left:5px;top:5px;width:20px;height:20px;border-radius:5px;background:{{y.d}}"></span></span></sc-for>
                    <span style="position:absolute;left:30px;top:30px;width:16px;height:16px;background:conic-gradient(from -45deg,{{it.cY}} 0 90deg,{{it.cB}} 90deg 180deg,{{it.cR}} 180deg 270deg,{{it.cG}} 270deg 360deg)"></span>
                    <span style="position:absolute;left:33px;top:2px;width:10px;height:28px;background:repeating-linear-gradient({{it.lane}} 0 8px,{{it.cell}} 8px 9px)"></span>
                    <span style="position:absolute;left:2px;top:33px;width:28px;height:10px;background:repeating-linear-gradient(90deg,{{it.lane}} 0 8px,{{it.cell}} 8px 9px)"></span>
                  </span>
                </span>
              </sc-if>
              <sc-if value="{{it.using}}" hint-placeholder-val="{{ false }}"><span class="ttl lm-pop" style="position:absolute;left:-8px;top:-2px;height:20px;border-radius:5px;background:#47BA2B;font-size:11px;line-height:21px;padding:0 6px;box-shadow:0 2px 0 #1D6B0F;transform:rotate(-8deg)">USING</span></sc-if>
              <sc-if value="{{it.hasLv}}" hint-placeholder-val="{{ false }}"><span class="ttl" style="position:absolute;right:-6px;top:-2px;width:30px;height:30px;border-radius:50%;background:linear-gradient(#5CC2FF,#1C72DA);box-shadow:0 0 0 2px #FFFFFF,0 2px 0 2px rgba(0,0,0,.25);font-size:11px;line-height:30px;text-align:center">Lv{{it.lv}}</span></sc-if>
            </a>
            <div style="width:100%;display:flex;flex-direction:column;gap:3px;margin-bottom:8px">
              <sc-for list="{{it.stats}}" as="s" hint-placeholder-count="3">
                <div style="display:flex;align-items:center;gap:4px"><span style="width:50px;flex:none;font:700 10.5px 'Baloo 2',sans-serif;color:#FFFFFF;text-shadow:0 1px 0 rgba(0,0,0,.35)">{{s.label}}</span><span style="flex:1;height:8px;border-radius:4px;background:rgba(0,0,0,.3);overflow:hidden"><span style="display:block;height:8px;width:{{s.w}};border-radius:4px;background:{{s.fill}}"></span></span><span style="width:30px;flex:none;text-align:end;font:400 10.5px 'Lilita One',sans-serif;color:#FFFFFF">{{s.val}}</span></div>
              </sc-for>
            </div>
            <sc-if value="{{it.hasShards}}" hint-placeholder-val="{{ false }}">
              <div style="width:100%;height:36px;display:flex;align-items:center;gap:4px">
                <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l7 7-7 13-7-13z" fill="#C77DFF" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"></path></svg>
                <span style="position:relative;flex:1;height:20px;border-radius:10px;background:rgba(0,0,0,.35);overflow:hidden"><span style="display:block;height:20px;width:{{it.shardW}};background:linear-gradient(#D7A6FF,#8E44E8)"></span><span style="position:absolute;inset:0;text-align:center;font:400 12px/20px 'Lilita One',sans-serif;color:#FFFFFF;text-shadow:0 1px 0 #000">{{it.shards}}</span></span>
              </div>
            </sc-if>
            <sc-if value="{{it.hasBtn}}" hint-placeholder-val="{{ true }}">
              <button type="button" onClick="{{it.tap}}" aria-label="{{it.btnAria}}" class="{{it.btnCls}}" style="width:100%;height:36px;border-radius:10px;font-size:14px">
                <sc-if value="{{it.btnCoin}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="position:relative;z-index:1"><circle cx="12" cy="13" r="10" fill="#B86E00"></circle><circle cx="12" cy="11.5" r="10" fill="url(#gGold)"></circle></svg></sc-if>
                <sc-if value="{{it.btnGem}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="position:relative;z-index:1"><path d="M6 3.5h12l4.5 6L12 21.5 1.5 9.5z" fill="#C2186D"></path><path d="M6 3.5h12l4.5 6H1.5z" fill="#FF6CC0"></path></svg></sc-if>
                <span style="position:relative;z-index:1;white-space:nowrap">{{it.btn}}</span>
              </button>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </div>

    <nav aria-label="Main" style="flex:none;margin:6px 12px 0;height:64px;border-radius:32px;background:linear-gradient(#123A8A,#0A2464);box-shadow:inset 0 0 0 2px rgba(143,182,255,.45),inset 0 2px 0 rgba(255,255,255,.18),0 6px 14px rgba(0,8,30,.45);display:grid;grid-template-columns:repeat(5, minmax(0, 1fr));align-items:center;padding:0 6px">
      <sc-for list="{{nav}}" as="t" hint-placeholder-count="5">
        <a href="{{t.href}}" aria-current="{{t.current}}" aria-label="{{t.label}}" style="position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;text-decoration:none;transform:translateY({{t.lift}}px)">
          <span style="width:{{t.size}}px;height:{{t.size}}px;border-radius:50%;background:{{t.bg}};box-shadow:{{t.sh}};display:grid;place-items:center">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{t.ink}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
          </span>
          <span style="font:400 10.5px 'Lilita One',sans-serif;color:{{t.labelInk}};letter-spacing:.3px">{{t.label}}</span>
        </a>
      </sc-for>
    </nav>
    <div style="height:22px;flex:none"></div>
  </div>

  <sc-if value="{{showInfo}}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;z-index:5;background:rgba(4,14,40,.7);display:flex;align-items:center;justify-content:center;padding:0 22px">
      <div role="dialog" aria-label="How the collection works" class="lm-pop" style="position:relative;border-radius:18px;background:linear-gradient(#2C7BDA,#1B57B4);box-shadow:inset 0 0 0 3px #5FB0FF,0 6px 0 #0A2A6B,0 18px 30px rgba(0,0,0,.45);padding:18px 16px 16px">
        <button type="button" onClick="{{toggleInfo}}" aria-label="Close" class="gl" style="position:absolute;right:-8px;top:-12px;width:38px;height:38px;border-radius:11px;background:linear-gradient(#FF8A7A,#F2463B 55%,#C4251B);box-shadow:0 4px 0 #7E120B"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="position:relative;z-index:1"><path d="M5 5l14 14M19 5L5 19" stroke="#FFFFFF" stroke-width="4.2" stroke-linecap="round"></path></svg></button>
        <h2 class="ttl" style="margin:0 0 8px;font-size:21px">Fair play promise</h2>
        <sc-for list="{{rules}}" as="r" hint-placeholder-count="4"><p style="margin:0 0 6px;font:600 13px/1.4 'Baloo 2',sans-serif;color:#E3F0FF;display:flex;gap:6px"><span style="color:#FFE27A">●</span><span>{{r}}</span></p></sc-for>
        <a href="Terms.dc.html" style="display:inline-block;margin-top:4px;font:800 13px 'Baloo 2',sans-serif;color:#FFE27A">Full gems &amp; coins rules</a>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const P = (d, f, s, w) => ({ d, f: f || 'none', s: s || 'none', w: w || 0 });
const RAR = {
  standard: ['Standard', 'linear-gradient(#56AEF7,#2470CF)', '#A6D8FF', '#0D4A9E'],
  rare: ['Rare', 'linear-gradient(#FFB64D,#EE7A0E)', '#FFDDA6', '#9A4A00'],
  epic: ['Epic', 'linear-gradient(#FF7C6C,#D6302A)', '#FFC4BA', '#7E120B'],
  legend: ['Legendary', 'linear-gradient(#C99BFF,#7B37D6)', '#E6D0FF', '#3E1A8E']
};

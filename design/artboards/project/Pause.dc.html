<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ludo Mela — Match menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFE27A}a:hover{color:#FFF3B8}
:root{--e:cubic-bezier(.2,.8,.2,1);--b:cubic-bezier(.34,1.56,.64,1)}
button,a{-webkit-tap-highlight-color:transparent;transition:transform 150ms var(--b),filter 160ms var(--e),box-shadow 160ms var(--e),opacity 160ms var(--e)}
button:focus-visible,a:focus-visible{outline:3px solid #FFFFFF;outline-offset:3px}
.ttl{font-family:'Lilita One',sans-serif;font-weight:400;color:#FFFFFF;letter-spacing:.4px;text-shadow:0 -1.5px 0 #0A2A6B,1.5px 0 0 #0A2A6B,0 1.5px 0 #0A2A6B,-1.5px 0 0 #0A2A6B,1.2px 1.2px 0 #0A2A6B,-1.2px 1.2px 0 #0A2A6B,1.2px -1.2px 0 #0A2A6B,-1.2px -1.2px 0 #0A2A6B,0 3px 0 #0A2A6B}
.gl{position:relative;border:0;cursor:pointer;font-family:'Lilita One',sans-serif;font-weight:400;color:#FFFFFF;letter-spacing:.4px;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;text-shadow:0 2px 0 rgba(0,0,0,.3);box-sizing:border-box}
.gl::after{content:'';position:absolute;left:8%;right:8%;top:3px;height:42%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,0));pointer-events:none}
.gl:active{transform:translateY(3px) scale(.98)}
.g-green{background:linear-gradient(#8DEB50,#47BA2B 55%,#2E9A1B);box-shadow:inset 0 -3px 0 rgba(0,0,0,.14),0 5px 0 #1D6B0F,0 9px 14px rgba(0,20,60,.35)}
.g-blue{background:linear-gradient(#6DCEFF,#2F95F2 55%,#1C72DA);box-shadow:inset 0 -3px 0 rgba(0,0,0,.14),0 4px 0 #0D4A9E,0 8px 12px rgba(0,20,60,.3)}
.g-red{background:linear-gradient(#FF9384,#F2463B 55%,#D22A21);box-shadow:inset 0 -3px 0 rgba(0,0,0,.14),0 4px 0 #8A1410,0 8px 12px rgba(0,20,60,.35)}
.g-gold{color:#5A2E00;text-shadow:0 1px 0 rgba(255,255,255,.55);background:linear-gradient(#FFEC8F,#FFC61F 55%,#F59E00);box-shadow:inset 0 -3px 0 rgba(0,0,0,.1),0 4px 0 #B26400,0 8px 12px rgba(0,20,60,.3)}
.g-off{background:linear-gradient(#7E8DAA,#5E6C88);box-shadow:inset 0 -3px 0 rgba(0,0,0,.14),0 4px 0 #3A4560}
.well{background:#0D3680;border-radius:14px;box-shadow:inset 0 3px 6px rgba(0,0,0,.4),inset 0 -1px 0 rgba(255,255,255,.14)}
.lm-in{animation:lmIn 480ms var(--b) backwards}
.lm-pop{animation:lmPop 380ms var(--b) backwards}
@keyframes lmIn{from{opacity:0;transform:scale(.7)}}
@keyframes lmPop{from{opacity:0;transform:scale(.6)}}
@media (prefers-reduced-motion: reduce){*{animation-duration:1ms !important;animation-delay:0ms !important;animation-iteration-count:1 !important;transition-duration:1ms !important}}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#1250C2;font-family:'Baloo 2',system-ui,sans-serif;color:#FFFFFF">
  <div style="position:absolute;inset:0;background:radial-gradient(120% 60% at 50% 50%,#3E9CFA 0%,#1F6EE0 40%,#1250C2 70%,#0B3592 100%)"></div>
  <div aria-hidden="true" style="position:absolute;left:7px;top:250px;width:376px;height:376px;border-radius:22px;background:linear-gradient(145deg,#E5A257,#8C4A18);filter:blur(3px);opacity:.75">
    <div style="position:absolute;left:10px;top:10px;width:140px;height:140px;border-radius:20px;background:#43B32D"></div>
    <div style="position:absolute;right:10px;top:10px;width:140px;height:140px;border-radius:20px;background:#FFC21F"></div>
    <div style="position:absolute;left:10px;bottom:10px;width:140px;height:140px;border-radius:20px;background:#EC3B30"></div>
    <div style="position:absolute;right:10px;bottom:10px;width:140px;height:140px;border-radius:20px;background:#2381EC"></div>
    <div style="position:absolute;left:152px;top:10px;width:72px;height:356px;background:#F2F5FA"></div>
    <div style="position:absolute;left:10px;top:152px;width:356px;height:72px;background:#F2F5FA"></div>
  </div>
  <div style="position:absolute;inset:0;background:rgba(3,12,40,.6)"></div>

  <div class="lm-in" role="dialog" aria-label="Match paused" style="position:absolute;left:18px;right:18px;top:110px;border-radius:28px;background:linear-gradient(#2064CC,#1549A6);box-shadow:inset 0 0 0 4px #3F86EA,inset 0 6px 0 rgba(255,255,255,.18),0 8px 0 #0A2E70,0 20px 40px rgba(0,0,0,.5)">
    <div style="height:62px;border-radius:28px 28px 0 0;background:linear-gradient(#5ED8FF,#1FA2EE);box-shadow:inset 0 4px 0 rgba(255,255,255,.5),inset 0 -5px 0 #0E78C2;display:flex;align-items:center;justify-content:center">
      <h1 class="ttl" style="margin:0;font-size:30px;letter-spacing:1px">PAUSED</h1>
    </div>
    <div style="padding:16px 16px 18px;display:flex;flex-direction:column;gap:14px">
      <span style="text-align:center;font:800 12.5px 'Baloo 2',sans-serif;color:#CFE3FF">Bots wait for you · your turn timer is frozen</span>
      <a href="Match.dc.html" class="gl g-green" style="height:60px;border-radius:20px;font-size:26px"><svg width="22" height="22" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true" style="position:relative;z-index:1"><path d="M7 4l13 8-13 8z"></path></svg><span style="position:relative;z-index:1">RESUME</span></a>

      <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:10px">
        <sc-for list="{{toggles}}" as="t" hint-placeholder-count="3">
          <button type="button" role="switch" aria-checked="{{t.checked}}" aria-label="{{t.label}}" onClick="{{t.toggle}}" style="border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:0">
            <span class="gl {{t.cls}}" style="width:58px;height:58px;border-radius:29px"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position:relative;z-index:1"><path d="{{t.icon}}"></path></svg></span>
            <span class="ttl" style="font-size:13px">{{t.label}}</span>
          </button>
        </sc-for>
      </div>

      <div style="display:flex;flex-direction:column;gap:6px">
        <span class="ttl" style="font-size:14px">Game speed</span>
        <div role="radiogroup" aria-label="Game speed" class="well" style="height:46px;padding:4px;display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:4px;box-sizing:border-box">
          <sc-for list="{{speeds}}" as="s" hint-placeholder-count="3"><button type="button" role="radio" aria-checked="{{s.checked}}" onClick="{{s.pick}}" class="gl {{s.cls}}" style="border-radius:11px;font-size:15px"><span style="position:relative;z-index:1">{{s.label}}</span></button></sc-for>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <span class="ttl" style="font-size:14px">Camera</span>
        <div role="radiogroup" aria-label="Camera" class="well" style="height:46px;padding:4px;display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:4px;box-sizing:border-box">
          <sc-for list="{{cams}}" as="s" hint-placeholder-count="2"><button type="button" role="radio" aria-checked="{{s.checked}}" onClick="{{s.pick}}" class="gl {{s.cls}}" style="border-radius:11px;font-size:15px"><span style="position:relative;z-index:1">{{s.label}}</span></button></sc-for>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px">
        <a href="GameRules.dc.html" class="gl g-blue" style="height:48px;border-radius:16px;font-size:16px"><span style="position:relative;z-index:1">RULES</span></a>
        <a href="Settings.dc.html" class="gl g-blue" style="height:48px;border-radius:16px;font-size:16px"><span style="position:relative;z-index:1">SETTINGS</span></a>
      </div>
      <button type="button" onClick="{{askLeave}}" class="gl g-red" style="height:50px;border-radius:16px;font-size:17px"><span style="position:relative;z-index:1">LEAVE MATCH</span></button>
    </div>
  </div>

  <sc-if value="{{confirm}}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;z-index:10;background:rgba(3,10,30,.55)">
      <div class="lm-pop" role="alertdialog" aria-label="Leave this match?" style="position:absolute;left:30px;right:30px;top:290px;border-radius:24px;background:linear-gradient(#2064CC,#1549A6);box-shadow:inset 0 0 0 4px #F2463B,0 8px 0 #0A2E70,0 20px 40px rgba(0,0,0,.5);padding:20px 18px;display:flex;flex-direction:column;gap:12px;align-items:center">
        <span class="ttl" style="font-size:22px">Leave this match?</span>
        <span style="text-align:center;font:700 13.5px/1.4 'Baloo 2',sans-serif;color:#DDEEFF">It counts as a loss and the 500-coin entry isn't returned. Practice matches cost nothing.</span>
        <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px;width:100%">
          <button type="button" onClick="{{stay}}" class="gl g-green" style="height:50px;border-radius:16px;font-size:17px"><span style="position:relative;z-index:1">STAY</span></button>
          <a href="Main.dc.html" class="gl g-red" style="height:50px;border-radius:16px;font-size:17px"><span style="position:relative;z-index:1">LEAVE</span></a>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sound: true, music: false, buzz: true, speed: 1, cam: 0, confirm: false };
  }
  renderVals() {
    const st = this.state;
    const tg = (key, label, on, off) => ({
      label, checked: st[key] ? 'true' : 'false', cls: st[key] ? 'g-gold' : 'g-off', icon: st[key] ? on : off,
      toggle: () => this.setState({ [key]: !this.state[key] })
    });
    return {
      toggles: [
        tg('sound', 'Sound', 'M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11', 'M4 9v6h4l5 4V5L8 9zM16 9l5 6M21 9l-5 6'),
        tg('music', 'Music', 'M9 18V5l11-2v13M9 18a2.5 2.5 0 1 1-5 0a2.5 2.5 0 1 1 5 0M20 16a2.5 2.5 0 1 1-5 0a2.5 2.5 0 1 1 5 0', 'M9 18V5l11-2v13M9 18a2.5 2.5 0 1 1-5 0a2.5 2.5 0 1 1 5 0M3 3l18 18'),
        tg('buzz', 'Vibration', 'M8 3h8v18H8zM4 8v8M20 8v8', 'M8 3h8v18H8zM3 3l18 18')
      ],
      speeds: ['1×', '1.5×', '2×'].map((l, i) => ({ label: l, checked: st.speed === i ? 'true' : 'false', cls: st.speed === i ? 'g-gold' : 'g-blue', pick: () => this.setState({ speed: i }) })),
      cams: ['2D FLAT', '3D TILT'].map((l, i) => ({ label: l, checked: st.cam === i ? 'true' : 'false', cls: st.cam === i ? 'g-gold' : 'g-blue', pick: () => this.setState({ cam: i }) })),
      confirm: st.confirm,
      askLeave: () => this.setState({ confirm: true }),
      stay: () => this.setState({ confirm: false })
    };
  }
}
</script>
</body>
</html>

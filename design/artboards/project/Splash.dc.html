<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ludo Mela — Splash</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFE27A}a:hover{color:#FFF3B8}
:root{--e:cubic-bezier(.2,.8,.2,1);--b:cubic-bezier(.34,1.56,.64,1)}
a{-webkit-tap-highlight-color:transparent;transition:transform 150ms var(--b)}
a:focus-visible{outline:3px solid #FFFFFF;outline-offset:3px}
.ttl{font-family:'Lilita One',sans-serif;font-weight:400;color:#FFFFFF;letter-spacing:.4px;text-shadow:0 -1.5px 0 #0A2A6B,1.5px 0 0 #0A2A6B,0 1.5px 0 #0A2A6B,-1.5px 0 0 #0A2A6B,1.2px 1.2px 0 #0A2A6B,-1.2px 1.2px 0 #0A2A6B,1.2px -1.2px 0 #0A2A6B,-1.2px -1.2px 0 #0A2A6B,0 3px 0 #0A2A6B}
.gl{position:relative;border:0;cursor:pointer;font-family:'Lilita One',sans-serif;font-weight:400;color:#FFFFFF;letter-spacing:.4px;text-decoration:none;display:flex;align-items:center;justify-content:center;text-shadow:0 2px 0 rgba(0,0,0,.3);box-sizing:border-box}
.gl::after{content:'';position:absolute;left:8%;right:8%;top:3px;height:42%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,0));pointer-events:none}
.gl:active{transform:translateY(3px) scale(.98)}
.g-green{background:linear-gradient(#8DEB50,#47BA2B 55%,#2E9A1B);box-shadow:inset 0 -3px 0 rgba(0,0,0,.14),0 5px 0 #1D6B0F,0 9px 14px rgba(0,20,60,.35)}
.lm-rays{animation:lmRays 30s linear infinite;transform-origin:50% 50%}
.lm-cube{animation:lmCube 4.5s linear infinite}
.lm-drop{animation:lmDrop 900ms var(--b) backwards}
.lm-slam{animation:lmSlam 760ms var(--b) backwards}
.lm-jump{animation:lmJump 1.3s var(--e) infinite;transform-origin:50% 100%}
.lm-load{animation:lmLoad 1.9s var(--e) forwards}
.lm-pulse{animation:lmPulse 1.4s ease-in-out infinite}
.lm-rise{animation:lmRise 520ms var(--e) backwards}
.lm-twinkle{animation:lmTwinkle 1.8s ease-in-out infinite}
@keyframes lmRays{to{transform:rotate(360deg)}}
@keyframes lmCube{from{transform:rotateX(-24deg) rotateY(0deg)}to{transform:rotateX(-24deg) rotateY(360deg)}}
@keyframes lmDrop{0%{opacity:0;transform:translateY(-260px)}60%{opacity:1;transform:translateY(12px)}100%{transform:translateY(0)}}
@keyframes lmSlam{0%{opacity:0;transform:scale(2.4) rotate(-6deg)}60%{opacity:1;transform:scale(.94)}100%{transform:scale(1)}}
@keyframes lmJump{0%,55%,100%{transform:translateY(0) scale(1,1)}20%{transform:translateY(-26px) scale(.92,1.08)}40%{transform:translateY(0) scale(1.12,.88)}}
@keyframes lmLoad{from{width:6%}to{width:100%}}
@keyframes lmPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes lmRise{from{opacity:0;transform:translateY(18px)}}
@keyframes lmTwinkle{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion: reduce){*{animation-duration:1ms !important;animation-delay:0ms !important;animation-iteration-count:1 !important;transition-duration:1ms !important}}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#1250C2;font-family:'Baloo 2',system-ui,sans-serif;color:#FFFFFF">
  <div style="position:absolute;inset:0;background:radial-gradient(90% 50% at 50% 40%,#9AD6FF 0%,#2F8BF0 32%,#1250C2 62%,#0A2C80 100%)"></div>
  <svg class="lm-rays" width="1000" height="1000" viewBox="-500 -500 1000 1000" aria-hidden="true" style="position:absolute;left:-305px;top:-160px"><sc-for list="{{rays}}" as="r" hint-placeholder-count="18"><path d="M0 0L-40 -500L40 -500z" fill="#FFFFFF" fill-opacity=".08" transform="rotate({{r}})"></path></sc-for></svg>
  <svg width="390" height="130" viewBox="0 0 390 130" aria-hidden="true" style="position:absolute;left:0;top:40px">
    <path d="M-10 20Q195 110 400 20" fill="none" stroke="#0A2A6B" stroke-opacity=".5" stroke-width="2"></path>
    <sc-for list="{{lights}}" as="b" hint-placeholder-count="14"><circle class="lm-twinkle" cx="{{b.x}}" cy="{{b.y}}" r="6" fill="{{b.c}}" stroke="#FFFFFF" stroke-width="1.5" style="animation-delay:{{b.d}}"></circle></sc-for>
  </svg>

  <div style="position:absolute;left:0;right:0;top:170px;display:flex;justify-content:center">
    <div class="lm-drop" style="width:104px;height:104px;perspective:460px">
      <div class="lm-cube" style="position:relative;width:104px;height:104px;transform-style:preserve-3d">
        <sc-for list="{{faces}}" as="f" hint-placeholder-count="6">
          <div style="position:absolute;inset:0;border-radius:24px;background:radial-gradient(circle at 50% 35%,#FFFFFF 0 55%,#DDE4EE 100%);box-shadow:inset 0 0 0 2px #CDD5E1,inset 0 -6px 10px rgba(60,80,120,.22);transform:{{f.tf}};display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));grid-template-rows:repeat(3, minmax(0, 1fr));padding:14px;box-sizing:border-box;backface-visibility:hidden">
            <sc-for list="{{f.pips}}" as="q" hint-placeholder-count="9"><span style="display:grid;place-items:center"><span style="width:{{q.sz}}px;height:{{q.sz}}px;border-radius:50%;background:{{q.bg}};opacity:{{q.on}};box-shadow:inset 0 2px 2px rgba(0,0,0,.4)"></span></span></sc-for>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <div class="lm-slam" role="img" aria-label="Ludo Mela" style="position:absolute;left:20px;top:300px;width:350px;height:200px;animation-delay:350ms">
    <svg width="350" height="200" viewBox="0 0 350 200" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset="1" stop-color="#CFE8FF"></stop></linearGradient><linearGradient id="mg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF6B0"></stop><stop offset=".5" stop-color="#FFC61F"></stop><stop offset="1" stop-color="#F08A00"></stop></linearGradient></defs>
      <text x="175" y="98" text-anchor="middle" font-family="Lilita One" font-size="104" fill="#0A2A6B" stroke="#0A2A6B" stroke-width="16" stroke-linejoin="round" transform="translate(0 6)">LUDO</text>
      <text x="175" y="98" text-anchor="middle" font-family="Lilita One" font-size="104" fill="url(#lg)" stroke="#0A2A6B" stroke-width="7" stroke-linejoin="round" paint-order="stroke">LUDO</text>
      <path d="M40 120h270l-16 30 16 30H40l16-30z" fill="#000000" opacity=".25" transform="translate(0 5)"></path>
      <path d="M40 118h270l-16 30 16 30H40l16-30z" fill="#E8322B" stroke="#FFD45A" stroke-width="4" stroke-linejoin="round"></path>
      <path d="M62 124h226" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="4" stroke-linecap="round"></path>
      <text x="175" y="166" text-anchor="middle" font-family="Lilita One" font-size="50" fill="url(#mg)" stroke="#7A1A00" stroke-width="6" stroke-linejoin="round" paint-order="stroke" letter-spacing="6">MELA</text>
    </svg>
  </div>

  <div style="position:absolute;left:0;right:0;top:540px;display:flex;justify-content:center;gap:26px" aria-hidden="true">
    <sc-for list="{{pucks}}" as="p" hint-placeholder-count="4">
      <span class="lm-jump" style="position:relative;width:46px;height:46px;display:block;animation-delay:{{p.d}}">
        <span style="position:absolute;inset:0;border-radius:50%;background:{{p.side}};transform:translateY(6px);box-shadow:0 8px 8px rgba(0,0,0,.35)"></span>
        <span style="position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 28%,{{p.light}} 0%,{{p.mid}} 62%,{{p.dark}} 100%);box-shadow:inset 0 0 0 3.5px #FFFFFF,inset 0 0 0 5.5px {{p.dark}},inset 0 4px 4px rgba(255,255,255,.4)"></span>
        <svg width="26" height="26" viewBox="0 0 24 24" style="position:absolute;left:10px;top:10px"><path d="M12 4.5c1.9 2.3 2.3 4.8 0 8c-2.3-3.2-1.9-5.7 0-8zM4 9.5c3.4.2 5.9 2.1 8 5.3c-4 .4-6.8-1.3-8-5.3zM20 9.5c-3.4.2-5.9 2.1-8 5.3c4 .4 6.8-1.3 8-5.3zM7.5 17h9a4.5 2 0 0 1-9 0z" fill="#FFFFFF"></path></svg>
      </span>
    </sc-for>
  </div>

  <div style="position:absolute;left:36px;right:36px;top:680px;display:flex;flex-direction:column;align-items:center;gap:12px">
    <sc-if value="{{loading}}" hint-placeholder-val="{{ true }}">
      <div role="progressbar" aria-label="Loading" style="width:100%;height:22px;border-radius:11px;background:#0D3680;box-shadow:inset 0 3px 6px rgba(0,0,0,.4),0 0 0 3px #FFFFFF;overflow:hidden">
        <div class="lm-load" style="height:22px;border-radius:11px;background:linear-gradient(#FFEC8F,#FFC61F 55%,#F59E00);box-shadow:inset 0 3px 0 rgba(255,255,255,.5)"></div>
      </div>
      <span class="ttl" style="font-size:16px">Polishing the dice…</span>
    </sc-if>
    <sc-if value="{{ready}}" hint-placeholder-val="{{ false }}">
      <a href="Main.dc.html" class="gl g-green lm-pulse" style="width:260px;height:62px;border-radius:22px;font-size:26px"><span style="position:relative;z-index:1">TAP TO PLAY</span></a>
    </sc-if>
    <span style="font:800 12px 'Baloo 2',sans-serif;color:#CFE3FF">Fully offline · no account needed</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { ready: false };
  }
  componentDidMount() { this.t = setTimeout(() => this.setState({ ready: true }), 2100); }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    const palette = ['#FFE27A', '#FF6CC0', '#7DF0E4', '#8DEB50', '#FFB02E'];
    const lights = Array.from({ length: 14 }, (_, i) => {
      const t = (i + 0.5) / 14;
      return { x: (-10 + t * 410).toFixed(1), y: (20 + 4 * 45 * t * (1 - t)).toFixed(1), c: palette[i % 5], d: (i % 4) * 0.4 + 's' };
    });
    const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
    const RED = 'radial-gradient(circle at 40% 35%,#FF7A6E,#B3140C 72%)';
    const INK = 'radial-gradient(circle at 40% 35%,#5A6176,#121726 72%)';
    const faces = [[1, 'rotateY(0deg)'], [6, 'rotateY(180deg)'], [2, 'rotateY(90deg)'], [5, 'rotateY(-90deg)'], [3, 'rotateX(90deg)'], [4, 'rotateX(-90deg)']].map((f) => ({
      tf: f[1] + ' translateZ(52px)',
      pips: Array.from({ length: 9 }, (_, i) => ({ on: PIPS[f[0]].includes(i) ? 1 : 0, bg: f[0] === 1 || f[0] === 4 ? RED : INK, sz: f[0] === 1 ? 28 : 17 }))
    }));
    const pucks = [['#FF8A7A', '#EC3B30', '#A71D16', '#7E120E'], ['#A3EC6A', '#43B32D', '#24781A', '#195A11'], ['#FFEA7A', '#FFC21F', '#C88A00', '#8E6100'], ['#7CC6FF', '#2381EC', '#114FA8', '#0B3878']]
      .map((p, i) => ({ light: p[0], mid: p[1], dark: p[2], side: p[3], d: (i * 0.16) + 's' }));
    return { rays: Array.from({ length: 18 }, (_, i) => i * 20), lights, faces, pucks, loading: !this.state.ready, ready: this.state.ready };
  }
}
</script>
</body>
</html>

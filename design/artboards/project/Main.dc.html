<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ludo Mela — Mela ground (lobby)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
:root{--e:cubic-bezier(.2,.8,.2,1);--b:cubic-bezier(.34,1.56,.64,1)}
button,a{-webkit-tap-highlight-color:transparent;transition:transform 150ms var(--b),filter 160ms var(--e),box-shadow 160ms var(--e)}
a:active,button:active{transform:translateY(3px) scale(.98)}
button:focus-visible,a:focus-visible{outline:3px solid #FFFFFF;outline-offset:3px}
.ttl{font-family:'Lilita One',sans-serif;font-weight:400;color:#FFFFFF;letter-spacing:.4px;text-shadow:0 -1.5px 0 #0A2A6B,1.5px 0 0 #0A2A6B,0 1.5px 0 #0A2A6B,-1.5px 0 0 #0A2A6B,1.2px 1.2px 0 #0A2A6B,-1.2px 1.2px 0 #0A2A6B,1.2px -1.2px 0 #0A2A6B,-1.2px -1.2px 0 #0A2A6B,0 3px 0 #0A2A6B}
.ttl-w{font-family:'Lilita One',sans-serif;font-weight:400;color:#FFF3D6;letter-spacing:.4px;text-shadow:0 -1.5px 0 #4A2008,1.5px 0 0 #4A2008,0 1.5px 0 #4A2008,-1.5px 0 0 #4A2008,0 2.5px 0 #4A2008}
.badge{position:absolute;min-width:22px;height:22px;border-radius:11px;font:400 12px/22px 'Lilita One',sans-serif;color:#FFFFFF;text-align:center;padding:0 5px;box-sizing:border-box;box-shadow:0 0 0 2px #FFFFFF,0 2px 0 2px rgba(0,0,0,.25);z-index:3}
.plank{background:linear-gradient(#B8763A,#8A4B1E 60%,#6B3410);box-shadow:inset 0 0 0 1.5px #D9A066,inset 0 2px 0 rgba(255,255,255,.3),0 3px 0 #3E1A06}
.tile{position:relative;display:block;text-decoration:none;border-radius:18px;overflow:hidden}
.tile::after{content:'';position:absolute;left:8px;right:8px;top:3px;height:34%;border-radius:14px;background:linear-gradient(rgba(255,255,255,.32),rgba(255,255,255,0));pointer-events:none}
.lm-twinkle{animation:lmTwinkle 1.8s ease-in-out infinite}
.lm-spin{animation:lmSpin 26s linear infinite;transform-origin:50% 50%;transform-box:fill-box}
.lm-rise{animation:lmRise 460ms var(--e) backwards}
.lm-float{animation:lmFloat 2.8s ease-in-out infinite}
.lm-wiggle{animation:lmWiggle 2.6s ease-in-out infinite}
.lm-shine{animation:lmShine 3.4s ease-in-out infinite}
.lm-shake{animation:lmShake 2.2s ease-in-out infinite;transform-origin:50% 100%}
.lm-fly{animation:lmFly 1200ms var(--e) forwards}
@keyframes lmTwinkle{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes lmSpin{to{transform:rotate(360deg)}}
@keyframes lmRise{from{opacity:0;transform:translateY(16px)}}
@keyframes lmFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes lmWiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-10deg)}90%{transform:rotate(8deg)}95%{transform:rotate(-4deg)}}
@keyframes lmShine{0%,60%{transform:translateX(-160%) skewX(-20deg)}100%{transform:translateX(560%) skewX(-20deg)}}
@keyframes lmShake{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-7deg)}82%{transform:rotate(6deg)}89%{transform:rotate(-3deg)}}
@keyframes lmFly{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1;transform:translateY(-12px) scale(1.15)}100%{opacity:0;transform:translateY(-110px) scale(.8)}}
@media (prefers-reduced-motion: reduce){*{animation-duration:1ms !important;animation-delay:0ms !important;animation-iteration-count:1 !important;transition-duration:1ms !important}}
.av-blink,.av-earl,.av-earr{transform-box:view-box}.av-blink{animation:avBlink 4.2s infinite}.av-earl{animation:avEarL 5s infinite}.av-earr{animation:avEarR 5s 1.4s infinite}@keyframes avBlink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}@keyframes avEarL{0%,84%,100%{transform:rotate(0)}88%{transform:rotate(-9deg)}93%{transform:rotate(5deg)}}@keyframes avEarR{0%,84%,100%{transform:rotate(0)}88%{transform:rotate(9deg)}93%{transform:rotate(-5deg)}}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#0B2466;font-family:'Baloo 2',system-ui,sans-serif;color:#FFFFFF">
  <svg width="0" height="0" aria-hidden="true" style="position:absolute"><defs>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFEC8F"></stop><stop offset=".55" stop-color="#FFC21F"></stop><stop offset="1" stop-color="#E08A00"></stop></linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8A7A"></stop><stop offset=".55" stop-color="#E8322B"></stop><stop offset="1" stop-color="#A8150F"></stop></linearGradient>
    <linearGradient id="gClay" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9A4418"></stop><stop offset=".45" stop-color="#E07A3A"></stop><stop offset="1" stop-color="#8A3A12"></stop></linearGradient>
    <linearGradient id="gPurple" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D2B0FF"></stop><stop offset="1" stop-color="#6A35D6"></stop></linearGradient>
    <linearGradient id="gPhone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A4A6E"></stop><stop offset="1" stop-color="#1B2440"></stop></linearGradient>
  </defs></svg>

  <!-- Mela night backdrop -->
  <div style="position:absolute;inset:0;background:linear-gradient(#0B2466 0%,#143A96 40%,#2462CF 70%,#2E74E0 100%)"></div>
  <svg width="390" height="844" aria-hidden="true" style="position:absolute;inset:0">
    <sc-for list="{{stars}}" as="s" hint-placeholder-count="12"><circle class="lm-twinkle" cx="{{s.x}}" cy="{{s.y}}" r="{{s.r}}" fill="#FFF3C4" style="animation-delay:{{s.d}}"></circle></sc-for>
    <g opacity=".22"><g class="lm-spin"><circle cx="330" cy="330" r="90" fill="none" stroke="#8FB6FF" stroke-width="3"></circle><path d="M330 240V420M240 330H420M266 266L394 394M394 266L266 394" stroke="#8FB6FF" stroke-width="2"></path></g></g>
  </svg>

  <div style="position:relative;z-index:1;height:100%;display:flex;flex-direction:column">
    <!-- Awning -->
    <div aria-hidden="true" style="flex:none;height:58px;position:relative">
      <div style="position:absolute;left:0;right:0;top:0;height:46px;background:repeating-linear-gradient(90deg,#E8322B 0 26px,#FFF1D0 26px 52px);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)"></div>
      <svg width="390" height="13" viewBox="0 0 390 13" style="position:absolute;left:0;top:45px"><sc-for list="{{scallops}}" as="s" hint-placeholder-count="15"><path d="{{s.d}}" fill="{{s.f}}"></path></sc-for></svg>
    </div>

    <!-- Header -->
    <div style="flex:none;height:58px;display:flex;align-items:center;gap:7px;padding:0 8px 0 10px">
      <a href="Profile.dc.html" aria-label="Your profile, level 7, 340 of 450 XP" style="position:relative;width:54px;height:54px;flex:none;display:block">
        <svg width="54" height="54" viewBox="0 0 54 54" aria-hidden="true" style="position:absolute;inset:0"><circle cx="27" cy="27" r="25" fill="#0A2A6B"></circle><circle cx="27" cy="27" r="25" fill="none" stroke="#3B5A9A" stroke-width="4"></circle><circle cx="27" cy="27" r="25" fill="none" stroke="#FFC61F" stroke-width="4" stroke-linecap="round" pathLength="100" stroke-dasharray="75 100" transform="rotate(-90 27 27)"></circle></svg>
        <span style="position:absolute;left:5px;top:5px;width:44px;height:44px;border-radius:50%;overflow:hidden;display:block"><svg width="44" height="44" viewBox="0 0 48 48" aria-hidden="true"><sc-for list="{{me}}" as="q" hint-placeholder-count="14"><path class="{{q.c}}" style="transform-origin:{{q.o}}" d="{{q.d}}" fill="{{q.f}}" stroke="{{q.s}}" stroke-width="{{q.w}}" stroke-linecap="round" stroke-linejoin="round"></path></sc-for></svg></span>
        <span class="ttl" style="position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);height:17px;min-width:26px;border-radius:9px;background:linear-gradient(#FFEC8F,#F59E00);box-shadow:0 0 0 1.5px #8A4B00;font-size:11px;line-height:18px;text-align:center;padding:0 4px;box-sizing:border-box">7</span>
      </a>
      <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
        <span class="ttl" style="font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Player</span>
        <span style="font:800 10.5px 'Baloo 2',sans-serif;color:#CFE0FF;white-space:nowrap">Level 7 · 340/450 XP</span>
      </span>
      <a href="Earn.dc.html" aria-label="86 gems. Get more" class="plank" style="position:relative;height:30px;border-radius:8px;display:flex;align-items:center;gap:3px;padding:0 24px 0 4px;text-decoration:none">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h12l4.5 6L12 21.5 1.5 9.5z" fill="#C2186D"></path><path d="M6 3.5h12l4.5 6H1.5z" fill="#FF6CC0"></path><path d="M12 21.5L1.5 9.5h21z" fill="#F0328F"></path></svg>
        <span class="ttl-w" style="font-size:14px">86</span>
        <span style="position:absolute;right:-6px;top:4px;width:22px;height:22px;border-radius:11px;background:linear-gradient(#8DEB50,#2E9A1B);box-shadow:0 0 0 1.5px #FFFFFF,0 2px 0 1.5px #1D6B0F;font:400 17px/21px 'Lilita One',sans-serif;text-align:center;color:#FFFFFF">+</span>
      </a>
      <a href="Earn.dc.html" aria-label="12,450 coins. Get more" class="plank" style="position:relative;height:30px;border-radius:8px;display:flex;align-items:center;gap:3px;padding:0 24px 0 4px;margin-left:4px;text-decoration:none">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.4" r="10" fill="#B86E00"></circle><circle cx="12" cy="11.6" r="10" fill="url(#gGold)"></circle><circle cx="12" cy="11.6" r="6.5" fill="#FFAE00" stroke="#FFE680" stroke-width="1.3"></circle></svg>
        <span class="ttl-w" style="font-size:14px">12.4K</span>
        <span style="position:absolute;right:-6px;top:4px;width:22px;height:22px;border-radius:11px;background:linear-gradient(#8DEB50,#2E9A1B);box-shadow:0 0 0 1.5px #FFFFFF,0 2px 0 1.5px #1D6B0F;font:400 17px/21px 'Lilita One',sans-serif;text-align:center;color:#FFFFFF">+</span>
      </a>
      <a href="Settings.dc.html" aria-label="Settings" style="width:34px;height:34px;flex:none;margin-left:6px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#FFE89A,#E0A000 70%,#9A6400);box-shadow:0 0 0 2px #6B4300,0 3px 0 2px #4A2E00;display:grid;place-items:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5A3A00" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"></circle><path d="M12 2.5v2.6M12 18.9v2.6M4.6 4.6l1.9 1.9M17.5 17.5l1.9 1.9M2.5 12h2.6M18.9 12h2.6M4.6 19.4l1.9-1.9M17.5 6.5l1.9-1.9"></path></svg></a>
    </div>

    <!-- Free stuff: four labelled stall tiles -->
    <div style="flex:none;display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:8px;padding:8px 10px 0">
      <sc-for list="{{stalls}}" as="t" hint-placeholder-count="4">
        <a href="{{t.href}}" aria-label="{{t.aria}}" class="lm-rise" style="position:relative;height:88px;border-radius:14px;background:{{t.bg}};box-shadow:inset 0 0 0 2px {{t.rim}},0 4px 0 {{t.edge}},0 8px 12px rgba(0,10,40,.35);text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6px;box-sizing:border-box;animation-delay:{{t.d}}">
          <span aria-hidden="true" style="position:absolute;left:0;right:0;top:0;height:12px;border-radius:14px 14px 0 0;background:repeating-linear-gradient(90deg,{{t.stripe}} 0 10px,#FFF1D0 10px 20px)"></span>
          <svg class="{{t.anim}}" width="44" height="44" viewBox="0 0 24 24" aria-hidden="true" style="margin-bottom:2px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))"><sc-for list="{{t.icon}}" as="q" hint-placeholder-count="5"><path d="{{q.d}}" fill="{{q.f}}" stroke="{{q.s}}" stroke-width="{{q.w}}" stroke-linejoin="round" stroke-linecap="round"></path></sc-for></svg>
          <span class="ttl" style="font-size:13px;line-height:1.05;text-align:center;white-space:nowrap">{{t.label}}</span>
          <span style="font:800 10px 'Baloo 2',sans-serif;color:#FFF3D6;line-height:1.2;white-space:nowrap">{{t.sub}}</span>
          <span class="badge" style="right:-6px;top:-8px;background:{{t.badgeBg}}">{{t.badge}}</span>
        </a>
      </sc-for>
    </div>

    <div style="flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;padding:0 10px">
      <!-- Main game: Play vs computer -->
      <a href="VsIntro.dc.html" aria-label="Play vs computer: Classic, 4 players, entry 500 coins" class="tile lm-rise" style="flex:none;height:150px;background:linear-gradient(135deg,#FFD24A 0%,#FFA51F 45%,#F07800 100%);box-shadow:inset 0 0 0 2.5px #FFE89A,0 5px 0 #9A4A00,0 12px 18px rgba(0,10,40,.4);animation-delay:120ms">
        <span aria-hidden="true" style="position:absolute;inset:0;overflow:hidden;border-radius:18px"><span class="lm-shine" style="position:absolute;top:0;bottom:0;width:46px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.4),rgba(255,255,255,0))"></span></span>
        <span style="position:absolute;left:16px;top:14px;display:flex;flex-direction:column;gap:3px;z-index:2">
          <span style="display:flex;align-items:center;gap:6px"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="7" width="16" height="13" rx="3" fill="#FFFFFF" stroke="#0A2A6B" stroke-width="1.8"></rect><path d="M12 3v4" stroke="#0A2A6B" stroke-width="1.8" stroke-linecap="round"></path><circle cx="12" cy="3" r="1.6" fill="#E8322B"></circle><circle cx="9" cy="13" r="1.6" fill="#0A2A6B"></circle><circle cx="15" cy="13" r="1.6" fill="#0A2A6B"></circle><path d="M9.5 16.8h5" stroke="#0A2A6B" stroke-width="1.6" stroke-linecap="round"></path></svg><span style="font:800 12px 'Baloo 2',sans-serif;color:#5A2E00;letter-spacing:.6px">VS COMPUTER</span></span>
          <span class="ttl" style="font-size:34px;line-height:1">PLAY</span>
          <span style="font:800 12px 'Baloo 2',sans-serif;color:#5A2E00">Lantern Bazaar · win 2,000</span>
        </span>
        <span style="position:absolute;left:14px;bottom:12px;display:flex;gap:6px;z-index:2">
          <span style="height:26px;border-radius:13px;background:rgba(90,46,0,.85);display:flex;align-items:center;gap:5px;padding:0 10px;font:400 12.5px 'Lilita One',sans-serif;color:#FFE27A">Classic</span>
          <span style="height:26px;border-radius:13px;background:rgba(90,46,0,.85);display:flex;align-items:center;gap:4px;padding:0 10px;font:400 12.5px 'Lilita One',sans-serif;color:#FFFFFF"><span style="display:flex;gap:2px"><sc-for list="{{seatDots}}" as="d" hint-placeholder-count="4"><span style="width:8px;height:8px;border-radius:50%;background:{{d}};box-shadow:0 0 0 1px #FFFFFF"></span></sc-for></span>4 players</span>
        </span>
        <span class="lm-float" aria-hidden="true" style="position:absolute;right:6px;top:10px;width:150px;height:130px;perspective:360px">
          <span style="position:absolute;left:20px;top:8px;width:108px;height:108px;transform:rotateX(50deg) rotateZ(-16deg);border-radius:10px;background:linear-gradient(#EBB984,#BE7F44);box-shadow:0 7px 0 #5E3410,0 14px 14px rgba(0,0,0,.3);display:block">
            <span style="position:absolute;left:4px;top:4px;width:100px;height:100px;border-radius:6px;overflow:hidden;background:#D2D2D2;display:block">
              <sc-for list="{{yards}}" as="y" hint-placeholder-count="4"><span style="position:absolute;left:{{y.x}}px;top:{{y.y}}px;width:40px;height:40px;background:{{y.m}}"><span style="position:absolute;left:5px;top:5px;width:30px;height:30px;border-radius:6px;background:rgba(0,0,0,.2)"></span></span></sc-for>
              <sc-for list="{{cells}}" as="c" hint-placeholder-count="72"><span style="position:absolute;left:{{c.x}}px;top:{{c.y}}px;width:6.2px;height:6.2px;background:{{c.bg}}"></span></sc-for>
              <span style="position:absolute;left:40px;top:40px;width:20px;height:20px;background:conic-gradient(from -45deg,#F8C21C 0 90deg,#1E8BEA 90deg 180deg,#E8322B 180deg 270deg,#76BE2E 270deg 360deg)"></span>
            </span>
          </span>
          <sc-for list="{{standing}}" as="p" hint-placeholder-count="4"><svg width="20" height="27" viewBox="0 0 26 34" style="position:absolute;left:{{p.x}}px;top:{{p.y}}px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))"><ellipse cx="13" cy="29" rx="11" ry="4.5" fill="{{p.dark}}"></ellipse><ellipse cx="13" cy="26" rx="11" ry="4.5" fill="{{p.main}}"></ellipse><path d="M6 25q1-9 7-12q6 3 7 12z" fill="{{p.main}}"></path><circle cx="13" cy="9" r="6.5" fill="{{p.main}}"></circle><circle cx="11" cy="7" r="2.2" fill="#FFFFFF" opacity=".6"></circle></svg></sc-for>
        </span>
        <span aria-hidden="true" style="position:absolute;right:12px;bottom:10px;width:44px;height:44px;border-radius:22px;background:#FFFFFF;box-shadow:0 3px 0 #9A4A00;display:grid;place-items:center;z-index:2"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z" fill="#F07800"></path></svg></span>
      </a>
      <a href="VsAiSetup.dc.html" style="flex:none;align-self:center;margin-top:-4px;height:28px;border-radius:14px;background:rgba(6,22,70,.55);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3);display:flex;align-items:center;gap:6px;padding:0 12px;text-decoration:none;font:400 12.5px 'Lilita One',sans-serif;color:#FFFFFF"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFE27A" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2.2"></circle><circle cx="10" cy="17" r="2.2"></circle></svg>Change mode, players or level</a>

      <!-- More ways to play: 2 × 2 labelled tiles -->
      <div style="flex:none;display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px">
        <sc-for list="{{modes}}" as="m" hint-placeholder-count="4">
          <a href="{{m.href}}" aria-label="{{m.aria}}" class="tile lm-rise" style="height:92px;background:{{m.bg}};box-shadow:inset 0 0 0 2.5px {{m.rim}},0 4px 0 {{m.edge}},0 10px 14px rgba(0,10,40,.35);animation-delay:{{m.d}}">
            <span style="position:absolute;left:12px;top:12px;right:44px;display:flex;flex-direction:column;gap:2px;z-index:2">
              <span class="ttl" style="font-size:17px;line-height:1.05;white-space:nowrap">{{m.title}}</span>
              <span style="font:800 11px/1.25 'Baloo 2',sans-serif;color:#FFFFFF;text-shadow:0 1px 0 rgba(0,0,0,.35)">{{m.sub}}</span>
            </span>
            <svg class="{{m.anim}}" width="52" height="52" viewBox="0 0 48 48" aria-hidden="true" style="position:absolute;right:4px;bottom:6px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))"><sc-for list="{{m.art}}" as="q" hint-placeholder-count="8"><path d="{{q.d}}" fill="{{q.f}}" stroke="{{q.s}}" stroke-width="{{q.w}}" stroke-linejoin="round" stroke-linecap="round"></path></sc-for></svg>
            <sc-if value="{{m.hasTag}}" hint-placeholder-val="{{ false }}"><span class="ttl" style="position:absolute;left:12px;bottom:9px;height:18px;border-radius:9px;background:rgba(0,0,0,.28);font-size:10.5px;line-height:19px;padding:0 8px">{{m.tag}}</span></sc-if>
          </a>
        </sc-for>
      </div>

      <!-- Mela pots -->
      <div style="flex:none">
        <div style="display:flex;align-items:baseline;justify-content:space-between;padding:0 4px 2px"><span class="ttl" style="font-size:15px">Mela pots</span><span style="font:800 11px 'Baloo 2',sans-serif;color:#CFE0FF">Win a match to earn one</span></div>
        <div style="position:relative;height:82px">
          <div class="plank" style="position:absolute;left:0;right:0;bottom:4px;height:13px;border-radius:5px"></div>
          <div style="position:absolute;left:0;right:0;bottom:17px;display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));align-items:end">
            <sc-for list="{{pots}}" as="p" hint-placeholder-count="3">
              <button type="button" onClick="{{p.tap}}" aria-label="{{p.aria}}" style="position:relative;border:0;background:none;padding:0;cursor:pointer;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end">
